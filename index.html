(function(){const d=LIB.dnd;if(!d)return;const X={"start":[["Bárbaro",[["Fúria","Nv. 1 · Entra em fúria por 1 minuto: vantagem em testes e resistências de Força, bônus no dano corpo a corpo com Força (+2; +3 no 9º; +4 no 16º) e resistência a dano contundente, cortante e perfurante. Não conjura nem se concentra. Acaba se você não atacar nem sofrer dano no turno. Usos: 2 (nv 1), 3 (nv 3), 4 (nv 6), 5 (nv 12), 6 (nv 17), ilimitada (nv 20). Recupera no descanso longo.","","Ação bônus","",""],["Defesa sem Armadura","Nv. 1 · Sem armadura, sua CA é 10 + modificador de Destreza + modificador de Constituição. Pode usar escudo e manter o benefício.","","Passiva","",""]]],["Bardo",[["Conjuração","Nv. 1 · Conjura magias de bardo com Carisma (CD 8 + prof + Car). Conhece magias em número fixo, usa um instrumento como foco e pode lançar como ritual as que tiverem a tag.","","Passiva","",""],["Inspiração de Bardo","Nv. 1 · Concede a uma criatura a 18 m que ouça você um dado de inspiração para somar a um teste de atributo, ataque ou resistência nos próximos 10 min. Usos igual ao mod. de Carisma por descanso longo (curto a partir do 5º). Dado: d6, d8 (5º), d10 (10º), d12 (15º).","1d6","Ação bônus","",""]]],["Bruxo",[["Patrono Sobrenatural","Nv. 1 · Escolha um patrono: o Arquifeérico, o Infernal ou o Grande Ancião. Ele concede benefícios nos níveis 1, 6, 10 e 14 e acrescenta magias à sua lista.","","Passiva","",""],["Pacto Mágico","Nv. 1 · Poucos espaços de magia, todos do mesmo círculo (sobe com o nível). Eles voltam em descanso curto ou longo. Conjura com Carisma (CD 8 + prof + Car), foco arcano.","","Passiva","",""]]],["Clérigo",[["Conjuração","Nv. 1 · Prepara magias de clérigo (Sabedoria + nível) todo dia e conjura com Sabedoria (CD 8 + prof + Sab). Símbolo sagrado como foco; rituais permitidos. Acesso a toda a lista de clérigo.","","Passiva","",""],["Domínio Divino","Nv. 1 · Escolha um domínio ligado à sua divindade: Conhecimento, Guerra, Luz, Natureza, Tempestade, Trapaça ou Vida. Ele dá magias e benefícios nos níveis 1, 2, 6, 8 e 17.","","Passiva","",""]]],["Druida",[["Druídico","Nv. 1 · Conhece o idioma secreto dos druidas, que permite deixar mensagens ocultas e perceber as de outros.","","Passiva","",""],["Conjuração","Nv. 1 · Prepara magias de druida (Sabedoria + nível) e conjura com Sabedoria (CD 8 + prof + Sab). Foco druídico; rituais permitidos.","","Passiva","",""]]],["Feiticeiro",[["Conjuração","Nv. 1 · Conhece magias de feiticeiro e conjura com Carisma (CD 8 + prof + Car), foco arcano.","","Passiva","",""],["Origem Mágica","Nv. 1 · Escolha a Linhagem Dracônica ou a Magia Selvagem; benefícios nos níveis 1, 6, 14 e 18.","","Passiva","",""]]],["Guardião",[["Inimigo Favorito","Nv. 1 · Escolha um tipo de inimigo (ex.: bestas, aberrações, mortos-vivos...). Vantagem em testes de Sabedoria (Sobrevivência) para rastreá-lo e de Inteligência para lembrar informações. Aprende um idioma. Mais tipos no 6º e 14º nível.","","Passiva","",""],["Desbravador Natural","Nv. 1 · Escolha um terreno favorito. Nele, terreno difícil não o atrasa, você não se perde, mantém atenção mesmo fazendo outras tarefas, move-se furtivamente em ritmo normal, encontra o dobro de alimento e rastreia melhor. Mais terrenos no 6º e 10º nível.","","Passiva","",""]]],["Guerreiro",[["Estilo de Combate","Nv. 1 · Escolha uma opção: Arquearia, Defesa, Duelo, Luta com Arma Grande, Proteção ou Luta com Duas Armas.","","Passiva","",""],["Retomar o Fôlego","Nv. 1 · Recupera 1d10 + nível de guerreiro em PV. 1 vez por descanso curto ou longo.","1d10","Ação bônus","",""]]],["Ladino",[["Especialização","Nv. 1 · Dobra o bônus de proficiência em 2 perícias (ou 1 perícia e ferramentas de ladrão). Mais 2 no 6º nível.","","Passiva","",""],["Ataque Furtivo","Nv. 1 · Dano extra se tiver vantagem no ataque ou um aliado a 1,5 m do alvo (arma sutil ou à distância): 1d6 no 1º nível, +1d6 a cada 2 níveis, até 10d6 no 19º.","1d6","1/turno","",""],["Gíria de Ladrão","Nv. 1 · Conhece o código secreto dos ladrões (idioma e sinais).","","Passiva","",""]]],["Mago",[["Conjuração","Nv. 1 · Prepara magias do grimório (Inteligência + nível) e conjura com Inteligência (CD 8 + prof + Int). Foco arcano; rituais lidos do grimório.","","Passiva","",""],["Grimório","Nv. 1 · Começa com 6 magias de 1º círculo; ganha 2 por nível e pode copiar outras (50 po e 2 horas por círculo).","","Passiva","",""],["Recuperação Arcana","Nv. 1 · Uma vez ao dia, em descanso curto, recupera espaços de magia de círculo total igual à metade do nível de mago (máx. 5º círculo).","","Passiva","",""]]],["Monge",[["Defesa sem Armadura","Nv. 1 · Sem armadura e sem escudo, CA = 10 + mod. de Destreza + mod. de Sabedoria.","","Passiva","",""],["Artes Marciais","Nv. 1 · Com golpes desarmados e armas de monge (simples sem pesada/duas mãos e espada curta): usa Destreza, dano d4 (d6 no 5º, d8 no 11º, d10 no 17º) e ataque desarmado como ação bônus.","1d4","Passiva","",""]]],["Paladino",[["Sentido Divino","Nv. 1 · Detecta celestiais, ínferos e mortos-vivos a 18 m (e objetos consagrados ou profanados). Usos: 1 + mod. de Carisma por descanso longo.","","Ação","",""],["Cura pelas Mãos","Nv. 1 · Reserva de cura igual a 5 × nível de paladino; toca para restaurar PV ou gasta 5 PV para curar doença ou veneno. Recupera em descanso longo.","","Ação","",""]]]],"prog":[["Bárbaro",[["Proficiências e Dado de Vida","Nv. 1 · d12 por nível; PV no 1º nível 12 + Con. Armaduras leves e médias, escudos, armas simples e marciais. Testes de resistência de Força e Constituição; 2 perícias entre Lidar com Animais, Atletismo, Intimidação, Natureza, Percepção e Sobrevivência.","","Passiva","",""],["Fúria","Nv. 1 · Entra em fúria por 1 minuto: vantagem em testes e resistências de Força, bônus no dano corpo a corpo com Força (+2; +3 no 9º; +4 no 16º) e resistência a dano contundente, cortante e perfurante. Não conjura nem se concentra. Acaba se você não atacar nem sofrer dano no turno. Usos: 2 (nv 1), 3 (nv 3), 4 (nv 6), 5 (nv 12), 6 (nv 17), ilimitada (nv 20). Recupera no descanso longo.","","Ação bônus","",""],["Defesa sem Armadura","Nv. 1 · Sem armadura, sua CA é 10 + modificador de Destreza + modificador de Constituição. Pode usar escudo e manter o benefício.","","Passiva","",""],["Ataque Imprudente","Nv. 2 · No primeiro ataque do turno, você ganha vantagem em ataques corpo a corpo com Força, mas os ataques contra você têm vantagem até o seu próximo turno.","","Livre","",""],["Senso de Perigo","Nv. 2 · Vantagem em testes de resistência de Destreza contra efeitos que você possa ver (armadilhas, magias). Não funciona cego, surdo ou incapacitado.","","Passiva","",""],["Caminho Primal","Nv. 3 · Escolha o Caminho do Berserk ou o Caminho do Guerreiro Totêmico. Ganha benefícios nos níveis 3, 6, 10 e 14.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Ataque Adicional","Nv. 5 · Ataca duas vezes ao usar a ação Atacar.","","Passiva","",""],["Movimento Rápido","Nv. 5 · Deslocamento +3 m enquanto não usar armadura pesada.","","Passiva","",""],["Instinto Feral","Nv. 7 · Vantagem em iniciativa. Se estiver surpreso no início do combate e não incapacitado, age normalmente no primeiro turno se entrar em fúria antes de qualquer outra coisa.","","Passiva","",""],["Crítico Brutal","Nv. 9 · Rola 1 dado de dano extra em acertos críticos corpo a corpo; 2 dados no 13º nível e 3 dados no 17º.","","Passiva","",""],["Fúria Implacável","Nv. 11 · Se cair a 0 PV em fúria, faça um teste de resistência de Constituição CD 10 e fique com 1 PV em vez de cair. A CD sobe 5 a cada uso e volta a 10 após descanso.","","Reação","",""],["Fúria Persistente","Nv. 15 · Sua fúria só termina se você cair inconsciente ou escolher encerrá-la.","","Passiva","",""],["Força Indomável","Nv. 18 · Se o total de um teste de Força for menor que seu valor de Força, use o valor.","","Passiva","",""],["Campeão Primal","Nv. 20 · Força e Constituição aumentam em 4; o máximo desses atributos passa a 24.","","Passiva","",""]]],["Bardo",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Armaduras leves; armas simples, bestas de mão, espadas longas, rapieiras e espadas curtas; 3 instrumentos musicais. Resistências de Destreza e Carisma; 3 perícias à escolha.","","Passiva","",""],["Conjuração","Nv. 1 · Conjura magias de bardo com Carisma (CD 8 + prof + Car). Conhece magias em número fixo, usa um instrumento como foco e pode lançar como ritual as que tiverem a tag.","","Passiva","",""],["Inspiração de Bardo","Nv. 1 · Concede a uma criatura a 18 m que ouça você um dado de inspiração para somar a um teste de atributo, ataque ou resistência nos próximos 10 min. Usos igual ao mod. de Carisma por descanso longo (curto a partir do 5º). Dado: d6, d8 (5º), d10 (10º), d12 (15º).","1d6","Ação bônus","",""],["Pau para Toda Obra","Nv. 2 · Soma metade do bônus de proficiência (arredondado para baixo) em testes de atributo sem proficiência.","","Passiva","",""],["Canção de Descanso","Nv. 2 · Durante um descanso curto, você e aliados que ouçam recuperam PV extras: d6 (nv 2), d8 (9º), d10 (13º), d12 (17º).","1d6","Passiva","",""],["Escola de Bardo","Nv. 3 · Escolha a Escola do Saber ou a Escola do Valor; benefícios nos níveis 3, 6 e 14.","","Passiva","",""],["Especialização","Nv. 3 · Dobre o bônus de proficiência em 2 perícias; mais 2 no 10º nível.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Fonte de Inspiração","Nv. 5 · Recupera todos os usos de Inspiração de Bardo em descanso curto ou longo.","","Passiva","",""],["Contrafeitiço","Nv. 6 · Concentre-se em uma performance até o fim do seu próximo turno: você e aliados a 9 m têm vantagem em resistências contra serem amedrontados ou enfeitiçados.","","Ação","",""],["Segredos Mágicos","Nv. 10 · Aprende 2 magias de qualquer classe, que contam como magias de bardo. Mais 2 no 14º e 2 no 18º nível.","","Passiva","",""],["Inspiração Superior","Nv. 20 · Ao rolar iniciativa sem usos de Inspiração, recupera 1 uso.","","Passiva","",""]]],["Bruxo",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Armaduras leves e armas simples. Resistências de Sabedoria e Carisma; 2 perícias entre Arcanismo, Blefar, História, Intimidação, Investigação, Natureza e Religião.","","Passiva","",""],["Patrono Sobrenatural","Nv. 1 · Escolha um patrono: o Arquifeérico, o Infernal ou o Grande Ancião. Ele concede benefícios nos níveis 1, 6, 10 e 14 e acrescenta magias à sua lista.","","Passiva","",""],["Pacto Mágico","Nv. 1 · Poucos espaços de magia, todos do mesmo círculo (sobe com o nível). Eles voltam em descanso curto ou longo. Conjura com Carisma (CD 8 + prof + Car), foco arcano.","","Passiva","",""],["Invocações Místicas","Nv. 2 · Aprende 2 invocações (3 no 5º, 4 no 7º, 5 no 9º, 6 no 12º, 7 no 15º, 8 no 18º). Pode trocar uma ao subir de nível.","","Passiva","",""],["Dádiva do Pacto","Nv. 3 · Escolha: Pacto da Lâmina, Pacto do Elo ou Pacto do Tomo.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Arcanum Místico (6º círculo)","Nv. 11 · Escolha uma magia de 6º círculo para lançar uma vez por descanso longo sem gastar espaço. 13º: 7º círculo; 15º: 8º; 17º: 9º.","","1/descanso longo","",""],["Mestre Místico","Nv. 20 · Ao invocar seu patrono por 1 minuto, recupera todos os espaços de magia de Pacto. 1 vez por descanso longo.","","1 minuto","",""]]],["Clérigo",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Armaduras leves e médias, escudos; armas simples. Resistências de Sabedoria e Carisma; 2 perícias entre História, Intuição, Medicina, Persuasão e Religião.","","Passiva","",""],["Conjuração","Nv. 1 · Prepara magias de clérigo (Sabedoria + nível) todo dia e conjura com Sabedoria (CD 8 + prof + Sab). Símbolo sagrado como foco; rituais permitidos. Acesso a toda a lista de clérigo.","","Passiva","",""],["Domínio Divino","Nv. 1 · Escolha um domínio ligado à sua divindade: Conhecimento, Guerra, Luz, Natureza, Tempestade, Trapaça ou Vida. Ele dá magias e benefícios nos níveis 1, 2, 6, 8 e 17.","","Passiva","",""],["Canalizar Divindade","Nv. 2 · Canaliza energia divina: 1 uso por descanso curto/longo (2 usos no 6º nível, 3 no 18º). Você começa com Expulsar Mortos-Vivos; seu domínio acrescenta outras opções.","","Ação","",""],["Canalizar Divindade: Expulsar Mortos-Vivos","Nv. 2 · Cada morto-vivo a 9 m que veja ou ouça você faz teste de Sabedoria ou fica expulso por 1 minuto, fugindo e sem poder se aproximar.","","Ação","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Destruir Mortos-Vivos","Nv. 5 · Mortos-vivos que falham na expulsão são destruídos se o ND for baixo: ND 1/2 (5º), 1 (8º), 2 (11º), 3 (14º), 4 (17º).","","Passiva","",""],["Intervenção Divina","Nv. 10 · Pede ajuda à divindade. Role d100: se ≤ seu nível de clérigo, ela intervém. Se funcionar, não pode usar por 7 dias; se falhar, só após descanso longo.","","Ação","",""],["Intervenção Divina Aprimorada","Nv. 20 · Sua Intervenção Divina funciona automaticamente, sem rolagem.","","Passiva","",""]]],["Druida",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Armaduras leves e médias e escudos (não metálicos); clava, adaga, dardo, azagaia, maça, bordão, cimitarra, foice, funda e lança; kit de herbalismo. Resistências de Inteligência e Sabedoria; 2 perícias da lista de druida.","","Passiva","",""],["Druídico","Nv. 1 · Conhece o idioma secreto dos druidas, que permite deixar mensagens ocultas e perceber as de outros.","","Passiva","",""],["Conjuração","Nv. 1 · Prepara magias de druida (Sabedoria + nível) e conjura com Sabedoria (CD 8 + prof + Sab). Foco druídico; rituais permitidos.","","Passiva","",""],["Forma Selvagem","Nv. 2 · Assume a forma de uma besta que você já tenha visto: 2 usos por descanso curto/longo. Limites: ND 1/4, sem voo ou natação (2º); ND 1/2, sem voo (4º); ND 1 (8º). Dura metade do nível em horas.","","Ação","",""],["Círculo Druídico","Nv. 2 · Escolha o Círculo da Terra ou o Círculo da Lua; benefícios nos níveis 2, 3, 6, 10 e 14.","","Passiva","",""],["Aprimoramento de Forma Selvagem","Nv. 4 · Pode assumir formas de ND 1/2 sem velocidade de voo (4º nível) e de ND 1 sem restrição de natação ou voo (8º).","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Corpo Atemporal","Nv. 18 · Envelhece 1 ano a cada 10 que passam.","","Passiva","",""],["Magias da Besta","Nv. 18 · Pode conjurar magias em Forma Selvagem com componentes verbais e somáticos.","","Passiva","",""],["Arquidruida","Nv. 20 · Usos ilimitados de Forma Selvagem e ignora componentes verbais, somáticos e materiais (sem custo) das magias de druida.","","Passiva","",""]]],["Feiticeiro",[["Proficiências e Dado de Vida","Nv. 1 · d6 por nível; PV no 1º nível 6 + Con. Sem armaduras; adagas, dardos, fundas, bordões e bestas leves. Resistências de Constituição e Carisma; 2 perícias entre Arcanismo, Blefar, Intimidação, Intuição, Persuasão e Religião.","","Passiva","",""],["Conjuração","Nv. 1 · Conhece magias de feiticeiro e conjura com Carisma (CD 8 + prof + Car), foco arcano.","","Passiva","",""],["Origem Mágica","Nv. 1 · Escolha a Linhagem Dracônica ou a Magia Selvagem; benefícios nos níveis 1, 6, 14 e 18.","","Passiva","",""],["Fonte de Magia (Pontos de Feitiçaria)","Nv. 2 · Tem pontos de feitiçaria iguais ao seu nível. Recupera tudo em descanso longo.","","Passiva","",""],["Magia Flexível","Nv. 2 · Converte pontos de feitiçaria em espaços de magia (custos: 1º=2, 2º=3, 3º=5, 4º=6, 5º=7) e espaços em pontos (1 por círculo).","","Ação bônus","",""],["Metamagia","Nv. 3 · Escolha 2 opções de Metamagia (3 no 10º e 4 no 17º) e gaste pontos de feitiçaria para modificar suas magias.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Restauração Feiticeira","Nv. 20 · Ao fim de um descanso curto, recupera 4 pontos de feitiçaria.","","Passiva","",""]]],["Guardião",[["Proficiências e Dado de Vida","Nv. 1 · d10 por nível; PV no 1º nível 10 + Con. Armaduras leves e médias, escudos; armas simples e marciais. Resistências de Força e Destreza; 3 perícias entre Lidar com Animais, Atletismo, Furtividade, Intuição, Investigação, Natureza, Percepção e Sobrevivência.","","Passiva","",""],["Inimigo Favorito","Nv. 1 · Escolha um tipo de inimigo (ex.: bestas, aberrações, mortos-vivos...). Vantagem em testes de Sabedoria (Sobrevivência) para rastreá-lo e de Inteligência para lembrar informações. Aprende um idioma. Mais tipos no 6º e 14º nível.","","Passiva","",""],["Desbravador Natural","Nv. 1 · Escolha um terreno favorito. Nele, terreno difícil não o atrasa, você não se perde, mantém atenção mesmo fazendo outras tarefas, move-se furtivamente em ritmo normal, encontra o dobro de alimento e rastreia melhor. Mais terrenos no 6º e 10º nível.","","Passiva","",""],["Estilo de Combate","Nv. 2 · Escolha uma opção: Arquearia, Defesa, Duelo ou Combate com Duas Armas.","","Passiva","",""],["Conjuração","Nv. 2 · Conhece magias de guardião (Sabedoria + CD 8 + prof + Sab). Usa foco druídico.","","Passiva","",""],["Arquétipo de Patrulheiro","Nv. 3 · Escolha o Caçador ou o Mestre das Bestas; benefícios nos níveis 3, 7, 11 e 15.","","Passiva","",""],["Consciência Primal","Nv. 3 · Gasta um espaço de magia para sentir a presença de tipos de criaturas (aberrações, celestiais, dragões, elementais, feéricos, ínferos, mortos-vivos) a 1,6 km por 1 minuto por círculo.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Ataque Adicional","Nv. 5 · Ataca duas vezes ao usar a ação Atacar.","","Passiva","",""],["Caminho da Terra","Nv. 8 · Atravessa terreno difícil não mágico sem custo extra e vegetação mágica não o afeta.","","Passiva","",""],["Camuflagem","Nv. 10 · Gasta 1 minuto para se camuflar: +10 em testes de Furtividade enquanto não se mover.","","Ação","",""],["Desaparecer","Nv. 14 · Pode usar Esconder-se como ação bônus e não pode ser rastreado por meios não mágicos.","","Ação bônus","",""],["Sentidos Ferais","Nv. 18 · Sem visão, atacar criaturas invisíveis não impõe desvantagem; sabe a posição de criaturas invisíveis a 9 m.","","Passiva","",""],["Matador de Inimigos","Nv. 20 · 1 vez por turno, soma o mod. de Sabedoria ao ataque ou dano contra um inimigo favorito.","","Passiva","",""]]],["Guerreiro",[["Proficiências e Dado de Vida","Nv. 1 · d10 por nível; PV no 1º nível 10 + Con. Todas as armaduras e escudos; armas simples e marciais. Resistências de Força e Constituição; 2 perícias entre Acrobacia, Lidar com Animais, Atletismo, História, Intuição, Intimidação, Percepção e Sobrevivência.","","Passiva","",""],["Estilo de Combate","Nv. 1 · Escolha uma opção: Arquearia, Defesa, Duelo, Luta com Arma Grande, Proteção ou Luta com Duas Armas.","","Passiva","",""],["Retomar o Fôlego","Nv. 1 · Recupera 1d10 + nível de guerreiro em PV. 1 vez por descanso curto ou longo.","1d10","Ação bônus","",""],["Pulso de Ação","Nv. 2 · Realiza uma ação adicional no turno. 1 uso por descanso curto/longo (2 usos no 17º nível).","","Livre","",""],["Arquétipo Marcial","Nv. 3 · Escolha Campeão, Mestre de Batalha ou Cavaleiro Arcano; benefícios nos níveis 3, 7, 10, 15 e 18.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 6, 8, 12, 14, 16 e 19.","","Passiva","",""],["Ataque Adicional","Nv. 5 · Ataca duas vezes ao usar a ação Atacar; 3 ataques no 11º nível e 4 no 20º.","","Passiva","",""],["Indomável","Nv. 9 · Joga de novo um teste de resistência que falhou (use o novo). 1 uso por descanso longo (2 no 13º, 3 no 17º).","","Livre","",""]]],["Ladino",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Armaduras leves; armas simples, bestas de mão, espadas longas, rapieiras e espadas curtas; ferramentas de ladrão. Resistências de Destreza e Inteligência; 4 perícias à escolha da lista de ladino.","","Passiva","",""],["Especialização","Nv. 1 · Dobra o bônus de proficiência em 2 perícias (ou 1 perícia e ferramentas de ladrão). Mais 2 no 6º nível.","","Passiva","",""],["Ataque Furtivo","Nv. 1 · Dano extra se tiver vantagem no ataque ou um aliado a 1,5 m do alvo (arma sutil ou à distância): 1d6 no 1º nível, +1d6 a cada 2 níveis, até 10d6 no 19º.","1d6","1/turno","",""],["Gíria de Ladrão","Nv. 1 · Conhece o código secreto dos ladrões (idioma e sinais).","","Passiva","",""],["Ação Astuta","Nv. 2 · Usa Disparada, Desengajar ou Esconder-se como ação bônus.","","Ação bônus","",""],["Arquétipo Ladino","Nv. 3 · Escolha Ladrão, Assassino ou Trapaceiro Arcano; benefícios nos níveis 3, 9, 13 e 17.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 10, 12, 16 e 19.","","Passiva","",""],["Esquiva Sobrenatural","Nv. 5 · Ao ser atingido por um atacante visível, reduz o dano à metade.","","Reação","",""],["Evasão","Nv. 7 · Sem dano ao passar em resistência de Destreza contra efeitos de área; metade se falhar.","","Passiva","",""],["Talento Confiável","Nv. 11 · Em testes de perícias com proficiência, qualquer resultado de 9 ou menos no d20 vira 10.","","Passiva","",""],["Sentido Cego","Nv. 14 · Se puder ouvir, sabe a posição de qualquer criatura escondida ou invisível a 3 m.","","Passiva","",""],["Mente Perspicaz","Nv. 15 · Proficiência em testes de resistência de Sabedoria.","","Passiva","",""],["Sagacidade","Nv. 18 · Nenhum ataque tem vantagem contra você, a menos que você esteja incapacitado.","","Passiva","",""],["Golpe de Sorte","Nv. 20 · Se errar um ataque, o transforma em acerto; se falhar num teste de atributo, rola 20 no d20.","","1/descanso curto","",""]]],["Mago",[["Proficiências e Dado de Vida","Nv. 1 · d6 por nível; PV no 1º nível 6 + Con. Sem armaduras; adagas, dardos, fundas, bordões e bestas leves. Resistências de Inteligência e Sabedoria; 2 perícias entre Arcanismo, História, Intuição, Investigação, Medicina e Religião.","","Passiva","",""],["Conjuração","Nv. 1 · Prepara magias do grimório (Inteligência + nível) e conjura com Inteligência (CD 8 + prof + Int). Foco arcano; rituais lidos do grimório.","","Passiva","",""],["Grimório","Nv. 1 · Começa com 6 magias de 1º círculo; ganha 2 por nível e pode copiar outras (50 po e 2 horas por círculo).","","Passiva","",""],["Recuperação Arcana","Nv. 1 · Uma vez ao dia, em descanso curto, recupera espaços de magia de círculo total igual à metade do nível de mago (máx. 5º círculo).","","Passiva","",""],["Tradição Arcana","Nv. 2 · Escolha uma escola: Abjuração, Adivinhação, Conjuração, Encantamento, Evocação, Ilusão, Necromancia ou Transmutação; benefícios nos níveis 2, 6, 10 e 14.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Maestria em Magia","Nv. 18 · Escolhe uma magia de 1º e uma de 2º círculo no grimório e as lança no nível base sem gastar espaço.","","Passiva","",""],["Assinatura Mágica","Nv. 20 · Escolhe duas magias de 3º círculo que passam a ser conjuradas sem gastar espaço uma vez por descanso.","","1/descanso curto","",""]]],["Monge",[["Proficiências e Dado de Vida","Nv. 1 · d8 por nível; PV no 1º nível 8 + Con. Sem armaduras; armas simples e espadas curtas. Resistências de Força e Destreza; 2 perícias entre Acrobacia, Atletismo, Furtividade, História, Intuição e Religião.","","Passiva","",""],["Defesa sem Armadura","Nv. 1 · Sem armadura e sem escudo, CA = 10 + mod. de Destreza + mod. de Sabedoria.","","Passiva","",""],["Artes Marciais","Nv. 1 · Com golpes desarmados e armas de monge (simples sem pesada/duas mãos e espada curta): usa Destreza, dano d4 (d6 no 5º, d8 no 11º, d10 no 17º) e ataque desarmado como ação bônus.","1d4","Passiva","",""],["Ki","Nv. 2 · Reserva de pontos de ki igual ao nível de monge (CD 8 + prof + Sab). Recupera em descanso curto ou longo.","","Passiva","",""],["Rajada de Golpes","Nv. 2 · Após a ação Atacar, faz 2 ataques desarmados como ação bônus.","","1 ki","",""],["Defesa Serena","Nv. 2 · Usa Esquivar como ação bônus.","","1 ki","",""],["Passo do Vento","Nv. 2 · Usa Desengajar ou Disparada como ação bônus, e o salto dobra.","","1 ki","",""],["Movimento sem Armadura","Nv. 2 · Deslocamento +3 m sem armadura/escudo (+4,5 m no 6º, +6 m no 10º, +7,5 m no 14º, +9 m no 18º). A partir do 9º, corre por paredes e líquidos.","","Passiva","",""],["Tradição Monástica","Nv. 3 · Escolha Caminho da Palma Aberta, das Sombras ou dos Quatro Elementos; benefícios nos níveis 3, 6, 11 e 17.","","Passiva","",""],["Aparar Projéteis","Nv. 3 · Reduz o dano de ataque à distância em 1d10 + Des + nível; se zerar, pode arremessar o projétil de volta com 1 ki.","1d10","Reação","",""],["Queda Suave","Nv. 4 · Reduz o dano de queda em 5 × nível de monge.","","Reação","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Ataque Adicional","Nv. 5 · Ataca duas vezes ao usar a ação Atacar.","","Passiva","",""],["Ataque Atordoante","Nv. 5 · Ao acertar um ataque corpo a corpo, o alvo faz teste de Constituição ou fica atordoado até o fim do seu próximo turno.","","1 ki","",""],["Ataques Potencializados com Ki","Nv. 6 · Seus ataques desarmados contam como mágicos para vencer resistências.","","Passiva","",""],["Evasão","Nv. 7 · Sem dano ao passar em resistência de Destreza contra efeitos de área; metade se falhar.","","Passiva","",""],["Quietude da Mente","Nv. 7 · Encerra em você um efeito que o enfeitice ou amedronte.","","Ação","",""],["Pureza do Corpo","Nv. 10 · Imune a doenças e veneno.","","Passiva","",""],["Língua do Sol e da Lua","Nv. 13 · Entende todos os idiomas e qualquer criatura que fale entende o que você diz.","","Passiva","",""],["Alma de Diamante","Nv. 14 · Proficiência em todos os testes de resistência; pode gastar 1 ki para refazer uma resistência que falhou.","","Passiva","",""],["Corpo Atemporal","Nv. 15 · Não sofre fraquezas da velhice, não pode ser envelhecido magicamente e dispensa comida e água.","","Passiva","",""],["Corpo Vazio","Nv. 18 · Fica invisível por 1 minuto e resiste a todo dano, exceto de energia. Com 8 ki pode lançar Projeção Astral.","","4 ki","",""],["Autoperfeição","Nv. 20 · Ao rolar iniciativa sem pontos de ki, recupera 4.","","Passiva","",""]]],["Paladino",[["Proficiências e Dado de Vida","Nv. 1 · d10 por nível; PV no 1º nível 10 + Con. Todas as armaduras e escudos; armas simples e marciais. Resistências de Sabedoria e Carisma; 2 perícias entre Atletismo, Intimidação, Intuição, Medicina, Persuasão e Religião.","","Passiva","",""],["Sentido Divino","Nv. 1 · Detecta celestiais, ínferos e mortos-vivos a 18 m (e objetos consagrados ou profanados). Usos: 1 + mod. de Carisma por descanso longo.","","Ação","",""],["Cura pelas Mãos","Nv. 1 · Reserva de cura igual a 5 × nível de paladino; toca para restaurar PV ou gasta 5 PV para curar doença ou veneno. Recupera em descanso longo.","","Ação","",""],["Estilo de Combate","Nv. 2 · Escolha uma opção: Defesa, Duelo, Luta com Arma Grande ou Proteção.","","Passiva","",""],["Conjuração","Nv. 2 · Prepara magias de paladino (Carisma + metade do nível) e conjura com Carisma (CD 8 + prof + Car). Símbolo sagrado como foco.","","Passiva","",""],["Destruição Divina","Nv. 2 · Ao acertar um ataque corpo a corpo, gasta um espaço de magia para causar 2d8 de dano radiante (+1d8 por círculo acima do 1º; +1d8 contra ínferos e mortos-vivos; máx. 5d8).","2d8","Passiva","",""],["Saúde Divina","Nv. 3 · Imune a doenças.","","Passiva","",""],["Juramento Sagrado","Nv. 3 · Escolha Devoção, Anciões ou Vingança. Dá magias de juramento e benefícios nos níveis 3, 7, 15 e 20.","","Passiva","",""],["Aprimoramento de Atributo","Nv. 4 · Aumente um atributo em 2 ou dois em 1 (máximo 20). Também nos níveis 8, 12, 16 e 19.","","Passiva","",""],["Ataque Adicional","Nv. 5 · Ataca duas vezes ao usar a ação Atacar.","","Passiva","",""],["Aura de Proteção","Nv. 6 · Você e aliados a 3 m somam seu mod. de Carisma (mín. +1) aos testes de resistência. Alcance 9 m no 18º nível.","","Passiva","",""],["Aura de Coragem","Nv. 10 · Você e aliados a 3 m não podem ser amedrontados. Alcance 9 m no 18º.","","Passiva","",""],["Destruição Divina Aprimorada","Nv. 11 · Todos os seus ataques corpo a corpo causam 1d8 de dano radiante extra.","1d8","Passiva","",""],["Toque Purificador","Nv. 14 · Encerra uma magia em você ou numa criatura voluntária. Usos: mod. de Carisma por descanso longo.","","Ação","",""]]]],"subs":[["Bárbaro › Caminho do Berserk",[["Frenesi","Nv. 3 · Ao entrar em fúria, pode fazer um ataque corpo a corpo como ação bônus em cada turno até o fim dela. Ao terminar, sofre 1 nível de exaustão.","","Passiva","",""],["Fúria Irracional","Nv. 6 · Em fúria, não pode ser enfeitiçado nem amedrontado; se já estiver, o efeito é suspenso durante a fúria.","","Passiva","",""],["Presença Intimidadora","Nv. 10 · Uma criatura a até 9 m que veja e ouça você faz teste de Sabedoria (CD 8 + prof + Car) ou fica amedrontada até o fim do seu próximo turno. Pode renovar por ação. Imune por 24 h se passar.","","Ação","",""],["Retaliação","Nv. 14 · Quando sofre dano de uma criatura a 1,5 m, faz um ataque corpo a corpo contra ela.","","Reação","",""]]],["Bárbaro › Caminho do Guerreiro Totêmico",[["Sentido da Besta e Falar com Animais","Nv. 3 · Pode lançar Sentido da Besta e Falar com Animais, apenas como rituais.","","Ritual","",""],["Totem Espiritual: Águia","Nv. 3 · Em fúria, inimigos têm desvantagem em ataques de oportunidade contra você e você pode usar Disparada como ação bônus.","","Passiva","",""],["Totem Espiritual: Lobo","Nv. 3 · Em fúria, aliados têm vantagem em ataques corpo a corpo contra criaturas hostis a 1,5 m de você.","","Passiva","",""],["Totem Espiritual: Urso","Nv. 3 · Em fúria, resistência a todo dano, exceto psíquico.","","Passiva","",""],["Aspecto da Besta: Águia","Nv. 6 · Enxerga até 1,6 km com nitidez e penumbra não impõe desvantagem em Percepção.","","Passiva","",""],["Aspecto da Besta: Lobo","Nv. 6 · Rastreia em ritmo rápido e move-se furtivamente em ritmo normal.","","Passiva","",""],["Aspecto da Besta: Urso","Nv. 6 · Capacidade de carga dobrada e vantagem em testes de Força para empurrar, puxar, levantar ou quebrar.","","Passiva","",""],["Andarilho Espiritual","Nv. 10 · Pode lançar Comunhão com a Natureza como ritual; o espírito de um animal totêmico traz a informação.","","Ritual","",""],["Apoteose Totêmica: Águia","Nv. 14 · Em fúria, tem deslocamento de voo igual ao deslocamento atual (cai se terminar o turno no ar sem apoio).","","Passiva","",""],["Apoteose Totêmica: Lobo","Nv. 14 · Em fúria, ao acertar um ataque corpo a corpo, derruba uma criatura Grande ou menor.","","Ação bônus","",""],["Apoteose Totêmica: Urso","Nv. 14 · Em fúria, criaturas hostis a 1,5 m têm desvantagem em ataques contra qualquer alvo que não seja você ou outro com esta característica.","","Passiva","",""]]],["Bardo › Escola do Saber",[["Proficiências Bônus","Nv. 3 · Ganha proficiência em 3 perícias à sua escolha.","","Passiva","",""],["Deboche","Nv. 3 · Gasta uma Inspiração de Bardo para subtrair o dado do ataque, dano ou teste de uma criatura a 18 m que ouça você.","","Reação","",""],["Segredos Mágicos Adicionais","Nv. 6 · Aprende 2 magias de qualquer classe, que contam como magias de bardo.","","Passiva","",""],["Habilidade Inigualável","Nv. 14 · Ao fazer um teste de atributo, pode gastar uma Inspiração de Bardo e somar o dado ao resultado; se o teste for bem-sucedido, o dado não é gasto.","","Passiva","",""]]],["Bardo › Escola do Valor",[["Proficiências Bônus","Nv. 3 · Proficiência com armaduras médias, escudos e armas marciais.","","Passiva","",""],["Inspiração de Combate","Nv. 3 · Uma criatura com sua Inspiração pode somar o dado ao dano de uma arma ou usar como reação para somar à CA contra um ataque.","","Passiva","",""],["Ataque Adicional","Nv. 6 · Ataca duas vezes ao usar a ação Atacar.","","Passiva","",""],["Magia de Batalha","Nv. 14 · Depois de lançar uma magia de bardo com ação, faz um ataque com arma como ação bônus.","","Ação bônus","",""]]],["Bruxo › Arquifeérico",[["Presença Feérica","Nv. 1 · Cada criatura num cubo de 3 m com origem em você faz teste de Sabedoria ou fica enfeitiçada ou amedrontada (sua escolha). 1 vez por descanso curto ou longo.","","Ação","",""],["Fuga das Brumas","Nv. 6 · Ao sofrer dano, torna-se invisível e teleporta-se até 18 m, ficando invisível até o fim do seu próximo turno ou até atacar/lançar magia. 1 vez por descanso curto ou longo.","","Reação","",""],["Defesas Encantadoras","Nv. 10 · Imune a ser enfeitiçado. Quando alguém tenta enfeitiçá-lo, pode reagir para que a criatura seja enfeitiçada por você por 1 minuto.","","Reação","",""],["Delírio Sombrio","Nv. 14 · Uma criatura a até 18 m faz teste de Sabedoria ou fica enfeitiçada ou amedrontada por 1 minuto, imersa em um reino ilusório. 1 vez por descanso curto ou longo.","","Ação","",""]]],["Bruxo › Infernal",[["Bênção do Obscuro","Nv. 1 · Ao reduzir uma criatura hostil a 0 PV, ganha PV temporários iguais ao mod. de Carisma + nível de bruxo.","","Passiva","",""],["Sorte do Obscuro","Nv. 6 · Ao fazer um teste de atributo ou resistência, soma 1d10 ao resultado. 1 vez por descanso curto ou longo.","1d10","Passiva","",""],["Resiliência Infernal","Nv. 10 · Após descanso curto/longo, escolha um tipo de dano para resistir (exceto mágico/prateado).","","Passiva","",""],["Arremessar pelo Inferno","Nv. 14 · Ao acertar um ataque, joga a criatura nos planos inferiores até o fim do seu próximo turno; ela sofre 10d10 de dano psíquico (se não for um ser infernal). 1 vez por descanso longo.","10d10","Passiva","",""]]],["Bruxo › Grande Ancião",[["Mente Desperta","Nv. 1 · Comunica-se telepaticamente com qualquer criatura que você veja a até 9 m, sem idioma em comum.","","Passiva","",""],["Defesa Entrópica","Nv. 6 · Ao errar um ataque contra você, concede vantagem no seu próximo ataque contra o atacante. 1 vez por descanso curto ou longo.","","Reação","",""],["Escudo de Pensamentos","Nv. 10 · Seus pensamentos não podem ser lidos, e você resiste a dano psíquico; quem lhe causar dano psíquico sofre o mesmo dano.","","Passiva","",""],["Criar Vassalo","Nv. 14 · Toca um humanoide incapacitado: ele fica enfeitiçado por você até Remover Maldição ser lançada nele ou você encerrar o efeito. 1 vez por descanso longo.","","Ação","",""]]],["Clérigo › Domínio do Conhecimento",[["Bênçãos do Conhecimento","Nv. 1 · Aprende 2 idiomas e ganha proficiência em 2 perícias entre Arcanismo, História, Natureza e Religião, com bônus dobrado.","","Passiva","",""],["Canalizar Divindade: Conhecimento das Eras","Nv. 2 · Escolhe uma perícia ou ferramenta e ganha proficiência nela por 10 minutos.","","Ação","",""],["Canalizar Divindade: Ler Pensamentos","Nv. 6 · Lê os pensamentos de uma criatura (e pode lançar Sugestão nela) se ela falhar na resistência.","","Ação","",""],["Magia Potente","Nv. 8 · Soma o mod. de Sabedoria ao dano dos truques de clérigo.","","Passiva","",""],["Visões do Passado","Nv. 17 · Concentre-se por 1 minuto para ler objeto ou área e ver cenas do passado.","","Passiva","",""]]],["Clérigo › Domínio da Guerra",[["Proficiências Bônus","Nv. 1 · Proficiência com armas marciais e armaduras pesadas.","","Passiva","",""],["Sacerdote da Guerra","Nv. 1 · Faz um ataque com arma como ação bônus. Usos igual ao mod. de Sabedoria por descanso longo.","","Ação bônus","",""],["Canalizar Divindade: Ataque Certeiro","Nv. 2 · Ganha +10 num ataque com arma.","","Ação bônus","",""],["Canalizar Divindade: Bênção do Deus da Guerra","Nv. 6 · Concede +10 em um ataque de aliado a 9 m.","","Reação","",""],["Ataque Divino","Nv. 8 · 1 vez por turno, +1d8 de dano da arma (2d8 no 14º nível).","1d8","Passiva","",""],["Avatar da Guerra","Nv. 17 · Resistência a dano contundente, cortante e perfurante de armas.","","Passiva","",""]]],["Clérigo › Domínio da Luz",[["Truque Bônus","Nv. 1 · Aprende o truque Luz.","","Passiva","",""],["Fulgor de Proteção","Nv. 1 · Impõe desvantagem a um ataque contra você feito por criatura que você veja. Usos igual ao mod. de Sabedoria por descanso longo.","","Reação","",""],["Canalizar Divindade: Resplendor do Amanhecer","Nv. 2 · Dispersa as trevas mágicas a 9 m e causa 2d10 + nível de dano radiante nas criaturas hostis (metade se passarem em Constituição).","2d10","Ação","",""],["Fulgor Aprimorado","Nv. 6 · Pode usar Fulgor de Proteção em um aliado a 9 m.","","Passiva","",""],["Magia Potente","Nv. 8 · Soma o mod. de Sabedoria ao dano dos truques de clérigo.","","Passiva","",""],["Coroa de Luz","Nv. 17 · Emite luz por 1 minuto; inimigos na luz têm desvantagem em resistências contra magias de fogo ou radiantes.","","Ação","",""]]],["Clérigo › Domínio da Natureza",[["Acólito da Natureza","Nv. 1 · Aprende um truque de druida e ganha proficiência em uma perícia entre Lidar com Animais, Natureza e Sobrevivência.","","Passiva","",""],["Proficiência Bônus","Nv. 1 · Proficiência com armaduras pesadas.","","Passiva","",""],["Canalizar Divindade: Encantar Animais e Plantas","Nv. 2 · Criaturas animais e plantas a 9 m fazem teste de Sabedoria ou ficam enfeitiçadas por 1 minuto.","","Ação","",""],["Tolerância a Elementos","Nv. 6 · Concede resistência a dano ácido, frio, fogo, relâmpago ou trovão a você ou aliado a 9 m.","","Reação","",""],["Ataque Divino","Nv. 8 · 1 vez por turno, +1d8 de dano de frio, fogo ou relâmpago (2d8 no 14º).","1d8","Passiva","",""],["Mestre da Natureza","Nv. 17 · Comanda animais e plantas enfeitiçados por você.","","Ação bônus","",""]]],["Clérigo › Domínio da Tempestade",[["Proficiências Bônus","Nv. 1 · Proficiência com armas marciais e armaduras pesadas.","","Passiva","",""],["Fúria da Tempestade","Nv. 1 · Quando atingido por uma criatura a 1,5 m, causa 2d8 de dano (relâmpago ou trovão) se ela falhar numa resistência. Usos igual ao mod. de Sabedoria.","2d8","Reação","",""],["Canalizar Divindade: Fúria Destrutiva","Nv. 2 · Maximiza o dano de relâmpago ou trovão de uma magia ou efeito.","","Passiva","",""],["Golpe do Relâmpago","Nv. 6 · Ao causar dano de relâmpago, pode empurrar o alvo Grande ou menor até 3 m.","","Passiva","",""],["Ataque Divino","Nv. 8 · 1 vez por turno, +1d8 de dano de trovão (2d8 no 14º).","1d8","Passiva","",""],["Nascido da Tempestade","Nv. 17 · Ganha deslocamento de voo igual ao deslocamento a pé ao ar livre.","","Passiva","",""]]],["Clérigo › Domínio da Trapaça",[["Bênção do Trapaceiro","Nv. 1 · Concede vantagem em testes de Furtividade a uma criatura (você ou outra) por 1 hora ou até usar novamente.","","Ação","",""],["Canalizar Divindade: Invocar Duplicidade","Nv. 2 · Cria uma ilusão sua por 1 minuto: você pode lançar magias dela e ter vantagem nos ataques quando você e ela estiverem perto do alvo.","","Ação","",""],["Canalizar Divindade: Manto de Sombras","Nv. 6 · Fica invisível até o fim do seu próximo turno ou até atacar/lançar magia.","","Ação","",""],["Ataque Divino","Nv. 8 · 1 vez por turno, +1d8 de dano de veneno (2d8 no 14º).","1d8","Passiva","",""],["Duplicidade Aprimorada","Nv. 17 · Você pode criar até quatro duplicatas em vez de uma, movendo-as como bônus.","","Passiva","",""]]],["Clérigo › Domínio da Vida",[["Proficiência Bônus","Nv. 1 · Proficiência com armaduras pesadas.","","Passiva","",""],["Discípulo da Vida","Nv. 1 · Magias de cura de 1º círculo ou maior curam PV extras: 2 + círculo da magia.","","Passiva","",""],["Canalizar Divindade: Preservar a Vida","Nv. 2 · Distribui até 5 × seu nível em PV entre criaturas a 9 m (máximo metade dos PV do alvo).","","Ação","",""],["Curandeiro Abençoado","Nv. 6 · Ao curar outro com magia, você também recupera 2 + círculo em PV.","","Passiva","",""],["Ataque Divino","Nv. 8 · 1 vez por turno, +1d8 de dano radiante (2d8 no 14º).","1d8","Passiva","",""],["Cura Suprema","Nv. 17 · Ao rolar dados para curar com magia ou Canalizar Divindade, usa o valor máximo possível.","","Passiva","",""]]],["Druida › Círculo da Terra",[["Truque Adicional","Nv. 2 · Aprende um truque adicional de druida.","","Passiva","",""],["Recuperação Natural","Nv. 2 · Durante um descanso curto, recupera espaços de magia de círculo total combinado igual à metade do nível de druida (arredondado para cima), máximo 5º círculo.","","1/descanso longo","",""],["Magias de Círculo","Nv. 3 · Escolha um terreno (Ártico, Costa, Deserto, Floresta, Pradaria, Montanha, Pântano ou Subterrâneo) para ganhar magias adicionais sempre preparadas, nos níveis 3, 5, 7 e 9.","","Passiva","",""],["Caminho da Terra","Nv. 6 · Pode atravessar terrenos difíceis não mágicos sem custo extra e vegetação mágica não o afeta.","","Passiva","",""],["Proteção da Natureza","Nv. 10 · Imune a veneno e doenças e não pode ser enfeitiçado ou amedrontado por elementais e seres feéricos.","","Passiva","",""],["Santuário da Natureza","Nv. 14 · Bestas e plantas devem fazer teste de Sabedoria para atacá-lo; quem falha escolhe outro alvo ou perde o ataque.","","Reação","",""]]],["Druida › Círculo da Lua",[["Forma Selvagem de Combate","Nv. 2 · Usa Forma Selvagem como ação bônus e pode gastar um espaço de magia para recuperar 1d8 PV por círculo na forma de besta.","","Ação bônus","",""],["Formas do Círculo","Nv. 2 · Pode assumir formas de ND 1 já no 2º nível; ND = nível ÷ 3 a partir do 6º.","","Passiva","",""],["Golpe Primitivo","Nv. 6 · Em forma de besta, seus ataques contam como mágicos para vencer resistência e imunidade.","","Passiva","",""],["Forma Selvagem Elemental","Nv. 10 · Gasta 2 usos de Forma Selvagem para se transformar em elemental do ar, da água, do fogo ou da terra.","","Ação bônus","",""],["Mil Formas","Nv. 14 · Conjura Alterar Aparência à vontade.","","Passiva","",""]]],["Feiticeiro › Linhagem Dracônica",[["Ancestral Dracônico","Nv. 1 · Escolha o tipo de dragão (determina o tipo de dano). Fala Dracônico e dobra seu bônus de proficiência em testes de Carisma ao interagir com dragões.","","Passiva","",""],["Resiliência Dracônica","Nv. 1 · Ganha +1 PV por nível de feiticeiro. Sem armadura, CA = 13 + mod. de Destreza.","","Passiva","",""],["Afinidade Elemental","Nv. 6 · Soma o mod. de Carisma ao dano de magias do tipo ligado ao seu ancestral e pode gastar 1 ponto de feitiçaria para ganhar resistência a esse dano por 1 hora.","","Passiva","",""],["Asas de Dragão","Nv. 14 · Desdobra asas e ganha deslocamento de voo igual ao seu deslocamento atual. 1 vez por descanso longo.","","Ação bônus","",""],["Presença Dracônica","Nv. 18 · Gasta 5 pontos de feitiçaria para emanar assombro ou medo por 1 minuto (concentração) a 18 m.","","Ação","",""]]],["Feiticeiro › Magia Selvagem",[["Surto de Magia Selvagem","Nv. 1 · Após lançar uma magia de feiticeiro de 1º círculo ou maior, o Mestre pode pedir 1d20: com 1, você rola na tabela de surtos de magia selvagem.","","Passiva","",""],["Marés de Caos","Nv. 1 · Ganha vantagem em 1 ataque, teste ou resistência; depois, o Mestre pode forçar um surto para recuperá-la.","","Passiva","",""],["Curva de Sorte","Nv. 6 · Gasta 2 pontos de feitiçaria para dar +1d4 ou −1d4 a um teste de d20 de outra criatura.","1d4","Reação","",""],["Caos Controlado","Nv. 14 · Ao rolar na tabela de surtos, rola duas vezes e escolhe um resultado.","","Passiva","",""],["Bombardeio de Magia","Nv. 18 · Ao rolar o máximo em um dado de dano de magia, pode rolar de novo e somar o resultado extra (1 vez por turno).","","Passiva","",""]]],["Guardião › Caçador",[["Presa do Caçador: Matador de Colossos","Nv. 3 · 1 vez por turno, +1d8 de dano em criatura que já esteja ferida.","1d8","Passiva","",""],["Presa do Caçador: Matador de Gigantes","Nv. 3 · Ataca uma criatura Grande ou maior que o atacou a 1,5 m, como reação, 1 vez por turno.","","Reação","",""],["Presa do Caçador: Rompedor de Hordas","Nv. 3 · 1 vez por turno, ataca outra criatura a 1,5 m do alvo com a mesma arma.","","Passiva","",""],["Táticas Defensivas: Escapar de Hordas","Nv. 7 · Ataques de oportunidade contra você têm desvantagem.","","Passiva","",""],["Táticas Defensivas: Defesa contra Multiataques","Nv. 7 · Após ser atingido por um ataque de uma criatura, ganha +4 de CA contra ataques seguintes dela.","","Reação","",""],["Táticas Defensivas: Vontade de Aço","Nv. 7 · Vantagem em testes contra ser amedrontado.","","Passiva","",""],["Multiataque: Saraivada","Nv. 11 · Faz um ataque à distância contra cada criatura a 3 m de um ponto à vista.","","Ação","",""],["Multiataque: Ataque Giratório","Nv. 11 · Ataca corpo a corpo cada criatura a 1,5 m.","","Ação","",""],["Defesa Superior: Evasão","Nv. 15 · Sem dano ao passar em resistência de Destreza; metade se falhar.","","Passiva","",""],["Defesa Superior: Resistir à Maré","Nv. 15 · Quando uma criatura errar um ataque corpo a corpo contra você, redireciona-o para outra criatura a 1,5 m.","","Reação","",""],["Defesa Superior: Esquiva Sobrenatural","Nv. 15 · Ao ser atingido por um atacante visível, reduz o dano à metade.","","Reação","",""]]],["Guardião › Mestre das Bestas",[["Companheiro do Patrulheiro","Nv. 3 · Ganha uma besta (ND ≤ 1/4, Média ou menor) como companheiro, que age no seu turno por seu comando. Adiciona seu bônus de proficiência à CA, ataque, dano e resistências.","","Passiva","",""],["Treinamento Excepcional","Nv. 7 · Seu companheiro pode fazer Desengajar, Disparada, Esquivar ou Ajudar quando você usar uma ação bônus para comandá-lo.","","Ação bônus","",""],["Fúria Bestial","Nv. 11 · O companheiro pode atacar duas vezes quando usar a ação Atacar.","","Passiva","",""],["Compartilhar Magias","Nv. 15 · Magias com alvo apenas você também afetam o companheiro se ele estiver a 9 m.","","Passiva","",""]]],["Guerreiro › Campeão",[["Acerto Crítico Aprimorado","Nv. 3 · Seus ataques com armas acertam crítico com 19 ou 20.","","Passiva","",""],["Atleta Renomado","Nv. 7 · Soma metade do bônus de proficiência em testes de For, Des ou Con sem proficiência; salta mais longe.","","Passiva","",""],["Estilo de Combate Adicional","Nv. 10 · Escolhe um segundo Estilo de Combate.","","Passiva","",""],["Acerto Crítico Superior","Nv. 15 · Seus ataques com armas acertam crítico com 18 a 20.","","Passiva","",""],["Sobrevivente","Nv. 18 · No início de cada turno, recupera 5 + mod. de Con PV se tiver menos que metade dos PV (e ao menos 1).","","Passiva","",""]]],["Guerreiro › Mestre de Batalha",[["Superioridade em Combate","Nv. 3 · Aprende 3 manobras e tem 4 dados de superioridade (d8), que recupera em descanso curto/longo. CD 8 + prof + For ou Des. Mais manobras no 7º, 10º e 15º; mais 1 dado no 7º e 15º.","1d8","Passiva","",""],["Estudante de Guerra","Nv. 3 · Proficiência com um tipo de ferramenta de artesão.","","Passiva","",""],["Conhecer Seu Inimigo","Nv. 7 · Observa uma criatura fora de combate e descobre se ela é superior ou inferior a você em For, Des, Con, CA, PV atuais, nível ou classe.","","1 minuto","",""],["Superioridade em Combate Aprimorada","Nv. 10 · Os dados de superioridade passam a d10 (d12 no 18º).","1d10","Passiva","",""],["Implacável","Nv. 15 · Se rolar iniciativa sem dados de superioridade, recupera 1.","","Passiva","",""]]],["Guerreiro › Cavaleiro Arcano",[["Conjuração","Nv. 3 · Usa magias de mago (Inteligência; CD 8 + prof + Int), sobretudo abjuração e evocação. Mais espaços de magia subindo de nível.","","Passiva","",""],["Elo com Arma","Nv. 3 · Vincula até duas armas; elas não podem ser desarmadas e voltam à mão como ação bônus.","","Passiva","",""],["Magia de Guerra","Nv. 7 · Depois de lançar um truque, faz um ataque com arma como ação bônus.","","Ação bônus","",""],["Golpe Arcano","Nv. 10 · Ao acertar uma criatura, ela tem desvantagem na próxima resistência contra sua magia no seu próximo turno.","","Passiva","",""],["Investida Arcana","Nv. 15 · Ao usar Pulso de Ação, teleporta-se até 9 m para um espaço desocupado.","","Passiva","",""],["Magia de Guerra Aprimorada","Nv. 18 · Após lançar qualquer magia (não só truques), faz um ataque com arma como ação bônus.","","Ação bônus","",""]]],["Ladino › Ladrão",[["Mãos Rápidas","Nv. 3 · Usa a ação bônus de Ação Astuta para Prestidigitação, desarmar armadilha, abrir fechadura ou usar um objeto.","","Ação bônus","",""],["Andarilho de Telhados","Nv. 3 · Escalar não custa movimento extra e o salto aumenta pelo mod. de Destreza.","","Passiva","",""],["Furtividade Suprema","Nv. 9 · Vantagem em Furtividade se mover até metade do deslocamento no turno.","","Passiva","",""],["Usar Dispositivo Mágico","Nv. 13 · Ignora todos os pré-requisitos de classe, raça e nível para usar itens mágicos.","","Passiva","",""],["Reflexos de Ladrão","Nv. 17 · Age duas vezes na primeira rodada de combate (iniciativa e iniciativa − 10).","","Passiva","",""]]],["Ladino › Assassino",[["Proficiências Bônus","Nv. 3 · Proficiência com kit de disfarce e kit de envenenador.","","Passiva","",""],["Assassinar","Nv. 3 · Vantagem em ataques contra criaturas que ainda não agiram; todo acerto contra criatura surpresa é crítico.","","Passiva","",""],["Especialização em Infiltração","Nv. 9 · Cria identidades falsas com 7 dias e 25 po.","","Passiva","",""],["Impostor","Nv. 13 · Imita fala, escrita e comportamento de outra pessoa após 3 horas de estudo.","","Passiva","",""],["Ataque Mortal","Nv. 17 · Ao atingir criatura surpresa, ela faz teste de Constituição (CD 8 + Des + prof) ou sofre o dobro do dano.","","Passiva","",""]]],["Ladino › Trapaceiro Arcano",[["Conjuração","Nv. 3 · Usa magias de mago (Inteligência; CD 8 + prof + Int), sobretudo encantamento e ilusão. Espaços de magia crescem com o nível.","","Passiva","",""],["Mãos Mágicas Trapaceiras","Nv. 3 · Sua Mão Mágica é invisível e pode furtar, abrir fechaduras ou guardar objetos.","","Passiva","",""],["Emboscada Mágica","Nv. 9 · Se estiver escondido da criatura, ela tem desvantagem em resistência contra sua magia.","","Passiva","",""],["Trapaceiro Versátil","Nv. 13 · Concentra a Mão Mágica para distrair, concedendo vantagem nos ataques contra a criatura.","","Ação bônus","",""],["Ladrão de Magia","Nv. 17 · Quando uma criatura lança magia contra você, anula o efeito e a rouba (aprende e conjura como sua por 8 horas).","","Reação","",""]]],["Mago › Escola de Abjuração",[["Abjuração Erudita","Nv. 2 · Copiar magias de abjuração custa metade do tempo e do ouro.","","Passiva","",""],["Proteção Arcana","Nv. 2 · Cria uma proteção com PV = 2 × nível de mago + mod. de Int. Absorve dano; recarrega ao conjurar abjuração.","","Reação","",""],["Proteção Projetada","Nv. 6 · Usa a proteção arcana para absorver dano de criatura a 9 m.","","Reação","",""],["Abjuração Aprimorada","Nv. 10 · Soma o bônus de proficiência em testes de Contramágica e Dissipar Magia.","","Passiva","",""],["Resistência à Magia","Nv. 14 · Vantagem em resistências contra magias e resistência a dano de magias.","","Passiva","",""]]],["Mago › Escola de Adivinhação",[["Adivinhação Erudita","Nv. 2 · Copiar magias de adivinhação custa metade do tempo e do ouro.","","Passiva","",""],["Presságio","Nv. 2 · Rola 2d20 após cada descanso longo e guarda os resultados. Pode substituir uma jogada de d20 de qualquer criatura que você veja por esses valores.","2d20","Passiva","",""],["Adivinho Especialista","Nv. 6 · Ao conjurar adivinhação de 2º círculo ou mais, recupera um espaço de magia de círculo inferior.","","Passiva","",""],["O Terceiro Olho","Nv. 10 · Ganha visão no escuro, visão etérea, compreensão maior ou ver o invisível  na resistência.","","Passiva","",""],["Truque Potente","Nv. 6 · Quando uma criatura passa em resistência contra seu truque, ainda sofre metade do dano.","","Passiva","",""],["Evocação Potencializada","Nv. 10 · Soma o mod. de Inteligência ao dano de magias de evocação.","","Passiva","",""],["Sobrecarga","Nv. 14 · Ao lançar magia de mago de 1º a 5º círculo que cause dano, causa o dano máximo. A primeira vez é gratuita; a partir da segunda antes de um descanso longo, você sofre 2d12 de dano necrótico por círculo (+1d12 a cada uso extra).","","Passiva","",""]]],["Mago › Escola de Ilusão",[["Ilusão Erudita","Nv. 2 · Copiar magias de ilusão custa metade do tempo e do ouro.","","Passiva","",""],["Ilusão Menor Aprimorada","Nv. 2 · Aprende Ilusão Menor; ao lançá-la, cria som e imagem ao mesmo tempo.","","Passiva","",""],["Ilusões Maleáveis","Nv. 6 · Pode alterar uma ilusão sustentada em concentração.","","Ação","",""],["Eu Ilusório","Nv. 10 · Quando uma criatura atacar você, cria duplicata ilusória que faz o ataque errar. Recarrega em descanso curto ou longo.","","Reação","",""],["Realidade Ilusória","Nv. 14 · Torna um objeto inanimado e não mágico da ilusão real por 1 minuto.","","Ação bônus","",""]]],["Mago › Escola de Necromancia",[["Necromancia Erudita","Nv. 2 · Copiar magias de necromancia custa metade do tempo e do ouro.","","Passiva","",""],["Colheita Macabra","Nv. 2 · Ao matar uma criatura com magia, recupera PV (2× círculo; 3× se necromancia).","","Passiva","",""],["Vassalos Mortos-Vivos","Nv. 6 · Ao lançar Animar Mortos, cria um morto-vivo adicional e eles ganham bônus de PV e dano.","","Passiva","",""],["Imunidade à Morte","Nv. 10 · Resistência a dano necrótico e seu máximo de PV não é reduzido.","","Passiva","",""],["Comandar Mortos-Vivos","Nv. 14 · Assume o controle de um morto-vivo (resistência de Carisma, mais difícil se ele tiver ND alto).","","Ação","",""]]],["Mago › Escola de Transmutação",[["Transmutação Erudita","Nv. 2 · Copiar magias de transmutação custa metade do tempo e do ouro.","","Passiva","",""],["Alquimia Menor","Nv. 2 · Altera temporariamente o material de objeto não mágico (madeira, pedra, ferro, cobre, prata) em 1 hora.","","Passiva","",""],["Pedra Transmutadora","Nv. 6 · Cria uma pedra que concede visão no escuro, +3 m de deslocamento, proficiência em Constituição ou resistência a dano (ácido, frio, fogo, relâmpago ou trovão).","","Ação","",""],["Metamorfo","Nv. 10 · Lança Metamorfose em si mesmo sem gastar espaço (1 vez por descanso).","","Ação","",""],["Mestre Transmutador","Nv. 14 · Consome a Pedra Transmutadora para efeitos: Panaceia, Restaurar Vida, Restaurar Juventude ou Transformar Substância.","","Ação","",""]]],["Monge › Caminho da Palma Aberta",[["Técnica da Palma Aberta","Nv. 3 · Ao acertar com Rajada de Golpes, impõe ao alvo uma de três opções: derrubar (Des), empurrar 4,5 m (For) ou impedir reações.","","Passiva","",""],["Totalidade do Corpo","Nv. 6 · Recupera PV igual a 3 × nível de monge. 1 vez por descanso longo.","","Ação","",""],["Tranquilidade","Nv. 11 · Ao fim de um descanso longo, ganha efeito de Santuário (CD 8 + Sab + prof) até o próximo.","","Passiva","",""],["Palma Vibrante","Nv. 17 · Planta vibrações em um alvo que acerte; 1 vez por dia pode encerrá-las para causar 10d10 de dano necrótico.","10d10","Passiva","",""]]],["Monge › Caminho das Sombras",[["Artes Sombrias","Nv. 3 · Gasta 2 ki para conjurar Escuridão, Visão no Escuro, Passos Sem Pegadas ou Silêncio; também aprende Ilusão Menor.","","Ação","",""],["Passo das Sombras","Nv. 6 · Em penumbra ou escuridão, teleporta-se até 18 m para outro espaço em penumbra ou escuridão e tem vantagem no próximo ataque corpo a corpo.","","Ação bônus","",""],["Manto das Sombras","Nv. 11 · Em penumbra ou escuridão, fica invisível até atacar, conjurar ou chegar à luz.","","Ação","",""],["Oportunista","Nv. 17 · Quando uma criatura a 1,5 m é atingida por ataque de outra, você faz um ataque corpo a corpo contra ela.","","Reação","",""]]],["Monge › Caminho dos Quatro Elementos",[["Discípulo dos Elementos","Nv. 3 · Aprende Sintonia Elemental e mais disciplinas elementais (nos níveis 6, 11 e 17). Pode gastar ki para conjurar magias elementais, com limite de ki por círculo (3º=2 a 3, 5º=4 a 6 ...).","","Passiva","",""],["Sintonia Elemental","Nv. 3 · Disciplina base: controla pequenos efeitos elementais (acender ou apagar chamas, esfriar ou aquecer, moldar terra, água ou ar por 1 minuto).","","Ação","",""],["Presas da Serpente de Fogo","Nv. 3 · Ao Atacar, seus ataques desarmados têm alcance +3 m e causam 1d10 de dano de fogo extra.","1d10","1 ki","",""],["Punho dos Quatro Trovões","Nv. 3 · Conjura Onda Trovejante.","","2 ki","",""],["Punho do Ar Inquebrável","Nv. 3 · Cria uma rajada de ar: criatura a 9 m faz teste de Força ou sofre 3d10 de dano (+1d10 por ki extra) e é empurrada 6 m.","3d10","2+ ki","",""],["Investida dos Espíritos do Vendaval","Nv. 3 · Conjura Lufada de Vento.","","2 ki","",""],["Moldar o Rio Fluente","Nv. 3 · Controla a água em um cubo de 9 m (muda direção, congela, cria ondas).","","1 ki","",""],["Ataque das Brasas Arrebatadoras","Nv. 3 · Conjura Mãos Flamejantes.","","2 ki","",""],["Gongo do Cume","Nv. 6 · Conjura Despedaçar.","","3 ki","",""],["Aperto do Vento Norte","Nv. 6 · Conjura Imobilizar Pessoa.","","3 ki","",""],["Chamas da Fênix","Nv. 11 · Conjura Bola de Fogo.","","4 ki","",""],["Postura da Névoa","Nv. 11 · Conjura Forma Gasosa em si mesmo.","","3 ki","",""],["Cavalgar o Vento","Nv. 11 · Conjura Voo em si mesmo.","","4 ki","",""],["Defesa da Montanha Eterna","Nv. 17 · Conjura Pele de Pedra em si mesmo.","","5 ki","",""],["Sopro do Inverno","Nv. 17 · Conjura Cone de Frio.","","6 ki","",""],["Rio de Chamas Famintas","Nv. 17 · Conjura Muralha de Fogo.","","5 ki","",""],["Onda de Terra Rolante","Nv. 17 · Conjura Muralha de Pedra.","","6 ki","",""]]],["Paladino › Juramento da Devoção",[["Canalizar Divindade: Arma Sagrada","Nv. 3 · Imbui uma arma com sua energia: soma o mod. de Carisma aos ataques e a arma emite luz por 1 minuto.","","Ação","",""],["Canalizar Divindade: Expulsar o Profano","Nv. 3 · Cada ínfero ou morto-vivo a 9 m que veja ou ouça você faz teste de Sabedoria ou é expulso por 1 minuto.","","Ação","",""],["Aura de Devoção","Nv. 7 · Você e aliados a 3 m não podem ser enfeitiçados. Alcance 9 m no 18º.","","Passiva","",""],["Pureza de Espírito","Nv. 15 · Está sempre sob efeito de Proteção contra o Bem e o Mal.","","Passiva","",""],["Resplendor Sagrado","Nv. 20 · Emite luz solar por 1 minuto: causa 10 de dano radiante a inimigos a 9 m e ganha vantagem em resistências contra magias de ínferos e mortos-vivos. 1 vez por descanso longo.","","Ação","",""]]],["Paladino › Juramento dos Anciões",[["Canalizar Divindade: Ira da Natureza","Nv. 3 · Vinhas espectrais prendem criaturas a 3 m (resistência de Força ou Destreza).","","Ação","",""],["Canalizar Divindade: Expulsar os Infiéis","Nv. 3 · Feéricos e ínferos a 9 m fazem teste de Sabedoria ou são expulsos por 1 minuto.","","Ação","",""],["Aura de Proteção","Nv. 7 · Você e aliados a 3 m têm resistência a dano de magias. Alcance 9 m no 18º.","","Passiva","",""],["Sentinela Imortal","Nv. 15 · Quando cair a 0 PV, fica com 1 PV. 1 vez por descanso longo; também não sofre efeitos do envelhecimento.","","Reação","",""],["Campeão Ancião","Nv. 20 · Assume forma de campeão ancestral por 1 minuto: conjura magias com ação bônus, recupera 10 PV por turno e inimigos a 3 m têm desvantagem em resistências contra suas magias. 1 vez por descanso longo.","","Ação","",""]]],["Paladino › Juramento da Vingança",[["Canalizar Divindade: Voto de Hostilidade","Nv. 3 · Escolhe uma criatura a 3 m e ganha vantagem em ataques contra ela por 1 minuto.","","Ação bônus","",""],["Canalizar Divindade: Abjurar Inimigo","Nv. 3 · Uma criatura a 18 m faz teste de Sabedoria ou fica amedrontada e imóvel por 1 minuto.","","Ação","",""],["Vingador Implacável","Nv. 7 · Ao acertar um ataque de oportunidade, pode se mover até metade do desl ho enorme ou maior · Instantânea. Abre uma fenda no corpo do alvo para um ser médio ou menor se alojar (entrar é ação de movimento); dentro, o ser tem cobertura e camuflagem totais. Discente (+2 PE): fenda aberta por 1 rodada, comportando seres igual ao Vigor do alvo; requer 2º círculo. Verdadeiro (+5 PE): alcance pessoal, alvo você; a fenda abriga até 10 seres, que ficam Atordoados e Inconscientes mas imunes a efeitos; se você ficar Sangrando, eles rolam 1d10 e são expulsos se o resultado for menor que a perda de PV; fechar a fenda é reação; requer 3º círculo.",'Sangue 1','',""],["Escudo de Carne","Reação · Pessoal · Alvo: você · Instantânea. Barreira de carne antes de um ataque ser atingido (antes do teste): RD 10 contra ele, mas você fica Vulnerável até o início do próximo turno. Também pode criar a camada diante de uma arma de fogo como silenciador: a penalidade da ação hostil cai para –1d20, mas o dano da arma cai em 5. Discente (+2 PE): alcance curto e alvo 1 ser ou arma de fogo; você continua Vulnerável. Verdadeiro (+5 PE): RD 20, ou remove totalmente a penalidade da ação hostil; requer afinidade.",'Sangue 1','',""],["Expansão Muscular","Movimento · Pessoal · Alvo: você · Instantânea. Concentra os músculos: no próximo teste ou habilidade baseado em Agilidade ou Força, conta como +2 no atributo, com +2d20 no teste e +2 no dano; depois fica Vulnerável por 1 rodada. Discente (+3 PE): bônus +3 e você não fica Vulnerável; requer 2º círculo. Verdadeiro (+7 PE): concentra a força nas pernas: salto de distância quintuplicada, ou usado como ação completa dentro de uma investida, causando +1d12 de dano por 10 pontos do teste de saltar; requer afinidade.",'Sangue 1','',""],["Físico do Predador","Padrão · Toque · Alvo: 1 ser · Cena · Vontade anula. Muda o físico do alvo para o de um felino de grande porte: +6 m de deslocamento e +2 em perícias de atributos físicos e perícias sem concentração; –2 nas demais; ele tende a agir de modo animalesco. Discente (+5 PE): +12 m, +5 e –5; além disso +5 nas rolagens de dano e não consegue conjurar rituais; requer 3º círculo. Verdadeiro (+9 PE): como Discente, copia os sentidos de um animal à escolha (faro, visão etc.), com –1d20 em testes relacionados; requer 3º círculo e afinidade.",'Sangue 1','',"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAABPWUlEQVR42u1ddXhc1fZdeyZJnRpVSrFC8RZ3ihce/tAij4c/tD/c3d2Ku/vDtbhrW6RQvC0UaGmpUI+s3x97HXJ63ySZpDNpAvd833zJzNy5cs7ZvvfaQDrSkY50pCMd6UhHOtKRjnSk4y8xSFo+n+V7rkKeLx3paCpEUlbDxl5Rm75FLb8t1d+VayCYVukMF3eUpFNQVMnRCcDSAD4kWaXP2gPoDKAbgIUAfEvyNwAwM+r3GTOrArAEyWUBTCTZDcBcALP1ygJYhuQ4AJPi36ejcCOTTkFRiCOjzboigD/MrFLv/wngWAB9AAwDMNbMJoTNTTKj/wMxjQHwNYCRALYAcCSAMjOjmVUA+APAyjp3upZFGKn+WjxCyQBYFMCPmuf2APYA8AuACm30h0laXZyf5E76txWALgDuBDBFRNFLhFaVz7nSkUqQBUkULUh2lBTZA0BPFwhWCWBvAN8BWA/AalK7LFbJSG5DsnVMZPruWwCLici6ARgkKUNdY0+SpSlxpATS1G2OpQFsDqAMwOZm9q6ZVZLcFsA2AAaI888CMBZANqEeDQLQ9k/x7kSQBfCD/k6XXTOY5ApS3d7RNduQXJhkh8Q9pSM10puEqkoA7QBsK0I5Q2pWKwDHA3gVwBs67jX9rjKh6rbNwbQqzWwaySsB9AMwA8BESY3zRGynAThGqtsjIsJ0pBKkyTGaSQBWB3CXmY2WBGgB4BkRw04AekrlymUvlEZEg8h4LzWzcgDbAzgYwJIARgNoYWZVZjYGwC0A9op+X5ouS0ogC1q1ypIsMbO5JNsBeBTAM2b2I8lWJNuI408Sp29hZndr41fmOGUpgOUiIz8QSbn+vUJ/x8nY/4NkG5KtRCSPA3iYZDvdU0lNcZh0pCrW/9gJ4sZWh6pUlxoF/Q3GN0huD2BtAFcDWE3XmkXyUgCfap43BnAJySwARq7ceLSRFHgjeS+KjfxO8hypU2Uy0Jcys+NFUO10DyeTfNfMnox/n+M5ap2ynJOgOfy7OAT+NgQSFrSOhWX9aI67w2MbwTO1iP7PkFxem7EVgPEAOgD4sKbriHA76Pe5iJUkS+Axka4ivHb6YkUAX0qdGwbgKQAjSO4le+RiM/u20HOZEkjzlxodAJTDA3OrA/hYm2szAE8CWFybur/UmzYydGMjt710/vZSa0q14UtkW1wL4D/i7qvAg4SVJC/TecbBg3wbwyPhzLHBqsSZ7wawVS2cuxLA7zrXYyKEhQDcbmZrKPWku5l9LKJZAcB2AB4iOR5Ad3gcZbyIaxSAqYlnbS0CHi7Hwgx5znrDA5c/ANgIwLv6famZ/f5X9r78ldWp9eDR5pHa0OWyuzLyDlXm+O2y2lSEu1afl/q0DYAqAHdpY5aY2YyEBFgdwPoA3gawqwiyD4CZZnaZ7JWKGu65DJ6CcrOZbVPTseFzksdqQz8LYANt2L4A3gfweUyEOrcBGAjgQH38kX67cVAZAQw1s+G5rhmpZlWay0oAqwBob2Yv/1XVLvsrEoc2dmVik/zPhiO5DoBdAPSQ5MgCeFOSJKtN8KyZfVHL9TKR2tRaxvhjAG4GcByAVma2Zk0bKHioSB4Mz7HaCh5kzNRCTIEBjAXwMoDrAFxmZhsm5sFqkFjhmBV0vYw2fmsAy0ZEYACGmNm
