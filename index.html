<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://pmbxwpiodtplqajstclm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Iwp2-WJWGGvOyJcV_-vpaA_D8eKMkML";

  const EldenAdBlock = {
    enabled: true,
    blockedDomains: [],

    async init() {
      console.log("[Elden AdBlock] Conectando à nuvem...");

      try {
        await this.loadSettings();
        await this.loadFilters();

        if (!this.enabled) {
          console.log("[Elden AdBlock] Desativado.");
          return;
        }

        this.cleanPage();
        this.observePage();

        console.log(
          "[Elden AdBlock] Ativo! Filtros:",
          this.blockedDomains.length
        );
      } catch (error) {
        console.error(
          "[Elden AdBlock] Erro na conexão:",
          error
        );
      }
    },

    async request(table) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${table}`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        throw new Error(`Supabase: ${response.status}`);
      }

      return response.json();
    },

    async loadSettings() {
      const settings = await this.request(
        "adblock_settings?select=enabled&limit=1"
      );

      if (settings.length > 0) {
        this.enabled = settings[0].enabled;
      }
    },

    async loadFilters() {
      const filters = await this.request(
        "adblock_filters?select=domain&enabled=eq.true"
      );

      this.blockedDomains = filters
        .map(item => item.domain.toLowerCase());
    },

    isBlocked(url) {
      try {
        const host = new URL(url, location.href)
          .hostname.toLowerCase();

        // Players oficiais precisam continuar acessíveis.
        const playerDomains = [
          "youtube.com",
          "youtube-nocookie.com",
          "youtu.be",
          "spotify.com"
        ];
        if (playerDomains.some(domain =>
          host === domain || host.endsWith("." + domain)
        )) return false;

        return this.blockedDomains.some(domain =>
          host === domain ||
          host.endsWith("." + domain)
        );
      } catch {
        return false;
      }
    },

    cleanElement(element) {
      if (!(element instanceof Element)) return;

      if (
        element.matches(
          '[data-ad="true"], [data-advertisement="true"]'
        )
      ) {
        element.remove();
        return;
      }

      if (
        element.matches("iframe[src]") &&
        this.isBlocked(element.src)
      ) {
        element.remove();
      }
    },

    cleanPage() {
      document.querySelectorAll(
        '[data-ad="true"], [data-advertisement="true"], iframe[src]'
      ).forEach(element => this.cleanElement(element));
    },

    observePage() {
      const observer = new MutationObserver(mutations => {
        mutations.forEach(mutation => {

op:[['Combatente',[["Habilidades de Combatente",L(["Ataque Especial","Ao atacar, gaste 2 PE para +5 no teste de ataque ou no dano. Conforme o NEX avança, gaste mais PE para mais bônus de +5, aplicáveis ao ataque ou ao dano: 3 PE/+10 (NEX 25%), 4 PE/+15 (NEX 55%), 5 PE/+20 (NEX 85%).",'',"2 PE"],["Habilidade de Trilha","Em NEX 10% escolha uma trilha de combatente e receba seu primeiro poder; novos poderes da trilha em NEX 40%, 65% e 99%.",'',""],["Poder de Combatente","Em NEX 15% você recebe um poder de combatente à sua escolha, e outro em NEX 30% e a cada 15% de NEX seguintes.",'',""],["Aumento de Atributo","Em NEX 20%, 50%, 80% e 95%, aumente em +1 um atributo à sua escolha. Nenhum atributo passa de 5 por esta via.",'',""],["Grau de Treinamento","Em NEX 35% e 70%, escolha perícias treinadas em número igual a 2 + Intelecto; o grau delas sobe um nível (treinado para veterano, veterano para expert).",'',""],["Versatilidade","Em NEX 50%, escolha entre um poder de combatente ou o primeiro poder de uma trilha de combatente que não seja a sua.",'',""])],["Poderes de Combatente",L(["Armamento Pesado","Proficiência com armas pesadas. Pré-requisito: For 2.",'',""],["Artista Marcial","Seus ataques desarmados causam 1d6 de dano letal e contam como armas ágeis; o dano sobe para 1d8 em NEX 35% e 1d10 em NEX 70%.",'',""],["Ataque de Oportunidade","Quando um ser sai voluntariamente de um espaço adjacente ao seu, gaste uma reação e 1 PE para fazer um ataque corpo a corpo contra ele.",'',"1 PE"],["Combater com Duas Armas","Com duas armas (ao menos uma leve), ao agredir você pode fazer dois ataques, um com cada arma; se fizer isso, sofre –1 dado de penalidade em todos os ataques até o próximo turno. Pré-requisitos: Agi 3, treinado em Luta ou Pontaria.",'',""],["Combate Defensivo","Ao agredir, você pode combater defensivamente: sofre –1 dado de penalidade nos ataques até o próximo turno, mas recebe +5 na Defesa. Pré-requisito: Int 2.",'',""],["Golpe Demolidor","Ao atacar um objeto ou usar a manobra quebrar, gaste 1 PE para causar dois dados de dano extra do mesmo tipo da arma. Pré-requisitos: For 2, treinado em Luta.",'',"1 PE"],["Golpe Pesado","O dano das suas armas corpo a corpo aumenta em mais um dado do mesmo tipo.",'',""],["Incansável","Uma vez por cena, gaste 2 PE para fazer uma ação de investigação adicional, usando Força ou Agilidade como atributo-base do teste.",'',"2 PE"],["Presteza Atlética","Ao facilitar uma investigação, gaste 1 PE para usar Força ou Agilidade no lugar do atributo-base; se passar, o próximo aliado que usar seu bônus também recebe +1 dado.",'',"1 PE"],["Proteção Pesada","Proficiência com Proteções Pesadas. Pré-requisito: NEX 30%.",'',""],["Reflexos Defensivos","Você recebe +2 na Defesa e nos testes de resistência. Pré-requisito: Agi 2. [bônus automático]",'',""],["Saque Rápido","Você pode sacar ou guardar itens como ação livre (em vez de ação de movimento). Com a regra de contagem de munição, uma vez por rodada recarrega uma arma de disparo como ação livre. Pré-requisito: treinado em Iniciativa.",'',""],["Segurar o Gatilho","Ao acertar um ataque com arma de fogo, faça outro ataque com a mesma arma contra o mesmo alvo, pagando 2 PE por ataque já feito no turno (2 PE no primeiro extra, 4 PE no segundo...), até errar ou atingir seu limite de PE por rodada. Pré-requisito: NEX 60%.",'',"2 PE"],["Sentido Tático","Ação de movimento e 2 PE para analisar o ambiente: você recebe bônus na Defesa e nos testes de resistência igual ao seu Intelecto até o fim da cena. Pré-requisitos: Int 2, treinado em Percepção e Tática.",'',"2 PE"],["Tanque de Guerra","Usando proteção pesada, a Defesa e a resistência a dano que ela fornece aumentam em +2. Pré-requisito: Proteção Pesada. [bônus automático, vale com a proteção equipada]",'',""],["Tiro Certeiro","Com arma de disparo, você soma sua Agilidade no dano e ignora a penalidade contra alvos envolvidos em combate corpo a corpo. Pré-requisito: treinado em Pontaria.",'',""],["Tiro de Cobertura","Ação padrão e 1 PE para disparar na direção de um personagem no alcance, forçando-o a se proteger: teste de Pontaria contra a Vontade dele. Se vencer, até o início do seu próximo turno ele não sai do lugar e sofre –5 em ataques; +5 no teste dele se o local for extremamente perigoso. Efeito de medo.",'',"1 PE"],["Transcender","Escolha um poder paranormal: você o recebe sem perder Sanidade nesse aumento de NEX. Pode escolher várias vezes.",'',""],["Treinamento em Perícia","Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35% pode escolher perícias já treinadas para virar veterano; a partir de 70%, veteranas para virar expert. Pode escolher várias vezes.",'',""])],["Aniquilador",L(["A Favorita","Escolha uma arma para ser sua favorita, como katana ou fuzil de assalto. A categoria da arma escolhida é reduzida em I.","NEX 10%"],["Técnica Secreta","A categoria da arma favorita passa a ser reduzida em II. Quando faz um ataque com ela, você pode gastar 2 PE para executar um dos efeitos abaixo como parte do ataque. Você pode adicionar mais efeitos gastando +2 PE por efeito adicional. Amplo. O ataque pode atingir um alvo adicional em seu alcance e adjacente ao original (use o mesmo teste de ataque para ambos). Destruidor. Aumenta o multiplicador de crítico da arma em +1.","NEX 40%"],["Técnica Sublime","Você adiciona os seguintes efeitos à lista de sua Técnica Secreta: Letal. Aumenta a margem de ameaça em +2. Você pode escolher este efeito duas vezes para aumentar a margem de ameaça em +5. Perfurante. Ignora até 5 pontos de resistência a dano de qualquer tipo do alvo.","NEX 65%"],["Máquina de Matar","A categoria da arma favorita passa a ser reduzida em III, ela recebe +2 na margem de ameaça e seu dano aumenta em um dado do mesmo tipo.","NEX 99%"])],["Comandante de Campo",L(["Inspirar Confiança","Sua liderança inspira seus aliados. Você pode gastar uma reação e 2 PE para fazer um aliado em alcance curto rolar novamente um teste recém realizado.","NEX 10%"],["Estrategista","Você pode direcionar aliados em alcance curto. Gaste uma ação padrão e 1 PE por aliado que quiser direcionar (limitado pelo seu Intelecto). No próximo turno dos aliados afetados, eles ganham uma ação de movimento adicional.","NEX 40%"],["Brecha na Guarda","Uma vez por rodada, quando um aliado causar dano em um inimigo que esteja em seu alcance curto, você pode gastar uma reação e 2 PE para que você ou outro aliado em alcance curto faça um ataque adicional contra o mesmo inimigo. Além disso, o alcance de inspirar confiança e estrategista aumenta para médio.","NEX 65%"],["Oficial Comandante","Você pode gastar uma ação padrão e 5 PE para que cada aliado que você possa ver em alcance médio receba uma ação padrão adicional no próximo turno dele.","NEX 99%"])],["Guerreiro",L(["Técnica Letal","Você recebe um aumento de +2 na margem de ameaça com todos os seus ataques corpo a corpo.","NEX 10%"],["Revidar","Sempre que bloquear um ataque, você pode gastar uma reação e 2 PE para fazer um ataque corpo a corpo no inimigo que o atacou.","NEX 40%"],["Força Opressora","Quando acerta um ataque corpo a corpo, você pode gastar 1 PE para realizar uma manobra derrubar ou empurrar contra o alvo do ataque como ação livre. Se escolher empurrar, recebe um bônus de +5 para cada 10 pontos de dano que causou no alvo. Se escolher derrubar e vencer no teste oposto, você pode gastar 1 PE para fazer um ataque adicional contra o alvo caído.","NEX 65%"],["Potência Máxima","Quando usa seu Ataque Especial com armas corpo a corpo, todos os bônus numéricos são dobrados. Por exemplo, se usar 5 PE para receber +5 no ataque e +15 no dano, você recebe +10 no ataque e +30 no dano.","NEX 99%"])],["Operações Especiais",L(["Iniciativa Aprimorada","Você recebe +5 em Iniciativa e uma ação de movimento adicional na primeira rodada.","NEX 10%"],["Ataque Extra","Uma vez por rodada, quando faz um ataque, você pode gastar 2 PE para fazer um ataque adicional.","NEX 40%"],["Surto de Adrenalina","Uma vez por rodada, você pode gastar 5 PE para realizar uma ação padrão ou de movimento adicional.","NEX 65%"],["Sempre Alerta","Você recebe uma ação padrão adicional no início de cada cena de combate.","NEX 99%"])],["Tropa de Choque",L(["Casca Grossa","Você recebe +1 PV para cada 5% de NEX e, quando faz um bloqueio, soma seu Vigor na resistência a dano recebida.","NEX 10%"],["Cai Dentro","Sempre que um oponente em alcance curto ataca um de seus aliados, você pode gastar uma reação e 1 PE para fazer com que esse oponente faça um teste de Vontade (DT Vig). Se falhar, o oponente deve atacar você em vez de seu aliado. Este poder só funciona se você puder ser efetivamente atacado e estiver no alcance do ataque (por exemplo, adjacente a um oponente atacando em corpo a corpo ou dentro do alcance de uma arma de ataque à distância). Um oponente que passe no teste de Vontade não pode ser afetado por seu poder Cai Dentro até o final da cena.","NEX 40%"],["Duro de Matar","Ao sofrer dano não paranormal, você pode gastar uma reação e 2 PE para reduzir esse dano à metade. Em NEX 85%, você pode usar esta habilidade para reduzir dano paranormal.","NEX 65%"],["Inquebrável","Enquanto estiver machucado, você recebe +5 na Defesa e resistência a dano 5. Enquanto estiver morrendo, em vez do normal, você não fica indefeso e ainda pode realizar ações. Você ainda segue as regras de morte normalmente.","NEX 99%"])]]],
['Especialista',[["Habilidades de Especialista",L(["Eclético","Ao fazer um teste de uma perícia, gaste 2 PE para receber os benefícios de ser treinado nela.",'',"2 PE"],["Perito","Escolha duas perícias em que você é treinado (exceto Luta e Pontaria). Ao testá-las, gaste 2 PE para somar +1d6 ao resultado; com o NEX, gaste +1 PE para aumentar o dado de bônus (ex.: NEX 55%, 4 PE para +1d10).",'',"2 PE"],["Habilidade de Trilha","Em NEX 10% escolha uma trilha de especialista e receba seu primeiro poder; novos poderes da trilha em NEX 40%, 65% e 99%.",'',""],["Poder de Especialista","Em NEX 15% você recebe um poder de especialista à sua escolha, e outro em NEX 30% e a cada 15% de NEX seguintes.",'',""],["Aumento de Atributo","Em NEX 20%, 50%, 80% e 95%, aumente em +1 um atributo à sua escolha. Nenhum atributo passa de 5 por esta via.",'',""],["Grau de Treinamento","Em NEX 35% e 70%, escolha perícias treinadas em número igual a 5 + Intelecto; o grau delas sobe um nível (treinado para veterano, veterano para expert).",'',""],["Engenhosidade","Em NEX 40%, ao usar Eclético, gaste 2 PE adicionais para receber os benefícios de ser veterano na perícia. Em NEX 75%, gaste 4 PE adicionais para receber os de expert.",'',"2 PE / 4 PE"],["Versatilidade","Em NEX 50%, escolha entre um poder de especialista ou o primeiro poder de uma trilha de especialista que não seja a sua.",'',""])],["Poderes de Especialista",L(["Artista Marcial","Seus ataques desarmados causam 1d6 de dano letal e contam como armas ágeis; o dano sobe para 1d8 em NEX 35% e 1d10 em NEX 70%.",'',""],["Balística Avançada","Proficiência com armas táticas de fogo e +2 nas rolagens de dano com elas.",'',""],["Conhecimento Aplicado","Ao fazer um teste de perícia (exceto Luta e Pontaria), gaste 2 PE para mudar o atributo-base da perícia para Intelecto. Pré-requisito: Int 2.",'',"2 PE"],["Hacker","+5 em testes de Tecnologia para invadir sistemas, e hackear qualquer sistema leva só uma ação completa. Pré-requisito: treinado em Tecnologia.",'',""],["Mãos Rápidas","Ao fazer um teste de Crime, pague 1 PE para fazê-lo como ação livre. Pré-requisitos: Agi 3, treinado em Crime.",'',"1 PE"],["Mochila de Utilidades","Um item à sua escolha (exceto arma) conta como uma categoria abaixo e ocupa 1 espaço a menos.",'',""],["Movimento Tático","Gaste 1 PE para ignorar a penalidade de deslocamento por terreno difícil e para escalar, até o fim do turno. Pré-requisito: treinado em Atletismo.",'',"1 PE"],["Na Trilha Certa","Ao ter sucesso em um teste para procurar pistas, gaste 1 PE para receber +1 dado no próximo teste; custos e bônus são cumulativos (passando no segundo, 2 PE para +2 dados, e assim por diante).",'',"1 PE"],["Nerd","Uma vez por cena, gaste 2 PE e faça um teste de Atualidades (DT 20). Se passar, recebe uma informação útil para a cena: dica de pista numa investigação, fraqueza de um inimigo em combate, e assim por diante.",'',"2 PE"],["Ninja Urbano","Proficiência com armas táticas de ataque corpo a corpo e de disparo (exceto de fogo) e +2 nas rolagens de dano com elas.",'',""],["Pensamento Ágil","Uma vez por rodada, numa cena de investigação, gaste 2 PE para fazer uma ação adicional de procurar pistas.",'',"2 PE"],["Perito em Explosivos","Você soma seu Intelecto à DT para resistir aos seus explosivos e pode excluir dos efeitos da explosão um número de alvos igual ao seu Intelecto.",'',""],["Primeira Impressão","Você recebe um bônus em dados no primeiro teste de Diplomacia, Enganação, Intimidação ou Intuição que fizer em uma cena (confira o número de dados no livro).",'',""],["Transcender","Escolha um poder paranormal: você o recebe sem perder Sanidade nesse aumento de NEX. Pode escolher várias vezes.",'',""],["Treinamento em Perícia","Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35% pode escolher perícias já treinadas para virar veterano; a partir de 70%, veteranas para virar expert. Pode escolher várias vezes.",'',""])],["Atirador de Elite",L(["Mira de Elite","Você recebe proficiência com armas de fogo que usam balas longas e soma seu Intelecto em rolagens de dano com essas armas.","NEX 10%"],["Disparo Letal","Quando faz a ação mirar você pode gastar 1 PE para aumentar em +2 a margem de ameaça do próximo ataque que fizer até o final de seu próximo turno.","NEX 40%"],["Disparo Impactante","Se estiver usando uma arma de fogo com calibre grosso você pode gastar 2 PE para fazer as manobras derrubar, desarmar, empurrar e quebrar usando um ataque a distância.","NEX 65%"],["Atirar para Matar","Quando faz um acerto crítico com uma arma de fogo, você causa dano máximo, sem precisar rolar dados.","NEX 99%"])],["Infiltrador",L(["Ataque Furtivo","Você sabe atingir os pontos vitais de um inimigo distraído. Uma vez por rodada, quando atinge um alvo desprevenido com um ataque corpo a corpo ou em alcance curto, ou um alvo que você esteja flanqueando, você pode gastar 1 PE para causar +1d6 pontos de dano do mesmo tipo da arma. Em NEX 40% o dano adicional aumenta para +2d6, em NEX 65% aumenta para +3d6 e em NEX 99% aumenta para +4d6.","NEX 10%"],["Gatuno","Você recebe +5 em Atletismo e Crime e pode percorrer seu deslocamento normal quando se esconder sem penalidade (veja a perícia Furtividade).","NEX 40%"],["Assassinar","Você pode gastar uma ação de movimento e 3 PE para analisar um alvo em alcance curto. Até o fim de seu próximo turno, seu primeiro Ataque Furtivo que causar dano a ele tem seus dados de dano extras dessa habilidade dobrados. Além disso, se sofrer dano de seu ataque, o alvo fica inconsciente ou morrendo, à sua escolha (Fortitude DT Agi evita).","NEX 65%"],["Sombra Fugaz","Quando faz um teste de Furtividade após atacar ou fazer outra ação chamativa, você pode gastar 3 PE para não sofrer a penalidade de –3d20 no teste.","NEX 99%"])],["Médico de Campo",L(["Paramédico","Você pode usar uma ação padrão e 2 PE para curar 2d10 pontos de vida a de si mesmo ou de um aliado adjacente. Você pode curar +1d10 PV respectivamente em NEX 40%, 65% e 99%, gastando +1 PE por dado adicional de cura.","NEX 10%"],["Equipe de Trauma","Você pode usar uma ação padrão e 2 PE para remover uma condição negativa (exceto morrendo) de um aliado adjacente.","NEX 40%"],["Resgate","Uma vez por rodada, se estiver em alcance curto de um aliado machucado ou morrendo, você pode se aproximar do aliado com uma ação livre (desde que seja capaz de fazê-lo usando seu deslocamento normal). Além disso, sempre que curar PV ou remover condições do aliado, você e o aliado recebem +5 na Defesa até o início de seu próximo turno. Por fim, para você, o total de espaços ocupados por carregar um personagem é reduzido pela metade.","NEX 65%"],["Reanimação","Uma vez por cena, você pode gastar uma ação completa e 10 PE para trazer de volta a vida um personagem que tenha morrido na mesma cena (exceto morte por dano massivo).","NEX 99%"])],["Negociador",L(["Eloquência","Você pode usar uma ação completa e 1 PE por alvo em alcance curto para afetar outros personagens com sua fala. Faça um teste de Diplomacia, Enganação ou Intimidação contra a Vontade dos alvos. Se você vencer, os alvos ficam fascinados enquanto você se concentrar (uma ação padrão por rodada). Um alvo hostil ou que esteja envolvido em combate recebe +5 em seu teste de resistência e tem direito a um novo teste por rodada, sempre que você se concentrar. Um personagem que passar no teste fica imune a este efeito por um dia.","NEX 10%"],["Discurso Motivador","Você pode gastar uma ação padrão e 4 PE para inspirar seus aliados com suas palavras. Você e todos os seus aliados em alcance curto ganham +1d20 em testes de perícia até o fim da cena. A partir de NEX 65%, você pode gastar 8 PE para fornecer um bônus total de +2d20.","NEX 40%"],["Eu Conheço um Cara","Uma vez por missão, você pode ativar sua rede de contatos para pedir um favor, como por exemplo trocar todo o equipamento do seu grupo (como se tivesse uma segunda fase de preparação de missão), conseguir um local de descanso ou mesmo ser resgatado de uma cena. O mestre tem a palavra final de quando é possível usar essa habilidade e quais favores podem ser obtidos.","NEX 65%"],["Truque de Mestre","Acostumado a uma vida de fingimento e manipulação, você pode gastar 5 PE para simular o efeito de qualquer habilidade que você tenha visto um de seus aliados usar durante a cena. Você ignora os pré-requisitos da habilidade, mas ainda precisa pagar todos os seus custos, incluindo ações, PE e materiais, e ela usa os seus parâmetros de jogo, como se você estivesse usando a habilidade em questão.","NEX 99%"])],["Técnico",L(["Inventário Otimizado","Você soma seu Intelecto à sua Força para calcular sua capacidade de carga. Por exemplo, se você tem Força 1 e Intelecto 3, seu inventário tem 20 espaços.","NEX 10%"],["Remendão","Você pode gastar uma ação completa e 1 PE para remover a condição quebrado de um equipamento adjacente até o final da cena. Além disso, qualquer equipamento geral tem sua categoria reduzida em I para você.","NEX 40%"],["Improvisar","Você pode improvisar equipamentos com materiais ao seu redor. Escolha um equipamento geral e gaste uma ação completa e 2 PE, mais 2 PE por categoria do item escolhido. Você cria uma versão funcional do equipamento, que segue suas regras de espaço e categoria como normal. Ao final da cena, seu equipamento improvisado se torna inútil.","NEX 65%"],["Preparado para Tudo","Você sempre tem o que precisa para qualquer situação. Sempre que precisar de um item qualquer (exceto armas), pode gastar uma ação de movimento e 3 PE por categoria do item para lembrar que colocou ele no fundo da bolsa! Depois de encontrado, o item segue normalmente as regras de inventário.","NEX 99%"])]]],
['Ocultista',[["Habilidades de Ocultista",L(["Escolhido pelo Outro Lado","Você pode lançar rituais de 1º círculo e, com o NEX, de círculos maiores (2º em NEX 25%, 3º em NEX 55%, 4º em NEX 85%). Começa com três rituais de 1º círculo; a cada avanço de NEX aprende um ritual de qualquer círculo que possa lançar, sem contar no limite de rituais conhecidos.",'',""],["Habilidade de Trilha","Em NEX 10% escolha uma trilha de ocultista e receba seu primeiro poder; novos poderes da trilha em NEX 40%, 65% e 99%.",'',""],["Poder de Ocultista","Em NEX 15% você recebe um poder de ocultista à sua escolha, e outro em NEX 30% e a cada 15% de NEX seguintes.",'',""],["Aumento de Atributo","Em NEX 20%, 50%, 80% e 95%, aumente em +1 um atributo à sua escolha. Nenhum atributo passa de 5 por esta via.",'',""],["Grau de Treinamento","Em NEX 35% e 70%, escolha perícias treinadas em número igual a 3 + Intelecto; o grau delas sobe um nível (treinado para veterano, veterano para expert).",'',""],["Versatilidade","Em NEX 50%, escolha entre um poder de ocultista ou o primeiro poder de uma trilha de ocultista que não seja a sua.",'',""])],["Poderes de Ocultista",L(["Camuflar Ocultismo","Com uma ação livre, esconda símbolos e sigilos de objetos ou da sua pele, deixando-os invisíveis para os outros. Ao lançar um ritual, gaste +2 PE para fazê-lo sem componentes e sem gesticular, só com concentração; os outros só percebem com um teste de Ocultismo (DT 25).",'',"+2 PE"],["Criar Selo","Fabrique selos paranormais de rituais que conheça: gasta uma ação de interlúdio e PE iguais ao custo do ritual. Você pode ter, ao mesmo tempo, um número de selos criados igual à sua Presença.",'',""],["Envolto em Mistério","Sua aparência assombrosa permite manipular e assustar pessoas ignorantes ou supersticiosas (o mestre define quem se encaixa). Como regra geral, +5 em Enganação e Intimidação contra pessoas não treinadas em Ocultismo.",'',""],["Especialista em Elemento","Escolha um elemento: a DT para resistir aos seus rituais desse elemento aumenta em +2.",'',""],["Ferramentas Paranormais","Reduz em I a categoria de um item paranormal e você pode ativar itens paranormais sem pagar seu custo em PE.",'',""],["Fluxo de Poder","Mantenha dois efeitos sustentados de rituais ativos ao mesmo tempo com apenas uma ação livre, pagando o custo de cada efeito separadamente. Pré-requisito: NEX 60%.",'',""],["Guiado pelo Paranormal","Uma vez por cena, gaste 2 PE para fazer uma ação de investigação adicional.",'',"2 PE"],["Identificação Paranormal","+10 em testes de Ocultismo para identificar criaturas, objetos ou rituais.",'',""],["Improvisar Componentes","Uma vez por cena, gaste uma ação completa e faça um teste de Investigação (DT 15). Se passar, você encontra objetos que servem como componentes ritualísticos de um elemento à sua escolha; o mestre decide se é possível na cena.",'',""],["Intuição Paranormal","Sempre que usar a ação facilitar investigação, some seu Intelecto ou Presença (à sua escolha) no teste.",'',""],["Mestre em Elemento","Escolha um elemento: o custo para lançar rituais desse elemento diminui em 1 PE. Pré-requisitos: Especialista em Elemento no elemento escolhido, NEX 45%.",'',""],["Ritual Potente","Você soma seu Intelecto nas rolagens de dano e nos efeitos de cura dos seus rituais. Pré-requisito: Int 2.",'',""],["Ritual Predileto","Escolha um ritual que você conhece: o custo dele diminui em 1 PE, acumulando com reduções de outras fontes.",'',""],["Tatuagem Ritualística","Símbolos marcados na sua pele reduzem em 1 PE o custo de rituais de alcance pessoal que têm você como alvo.",'',""],["Transcender","Escolha um poder paranormal: você o recebe sem perder Sanidade nesse aumento de NEX. Pode escolher várias vezes.",'',""],["Treinamento em Perícia","Escolha duas perícias e torne-se treinado nelas. A partir de NEX 35% pode escolher perícias já treinadas para virar veterano; a partir de 70%, veteranas para virar expert. Pode escolher várias vezes.",'',""])],["Conduíte",L(["Ampliar Ritual","Quando lança um ritual, você pode gastar +2 PE para aumentar seu alcance em um passo (de curto para médio, de médio para longo ou de longo para extremo) ou dobrar sua área de efeito.","NEX 10%"],["Acelerar Ritual","Uma vez por rodada, você pode aumentar o custo de um ritual em 4 PE para conjurá-lo como uma ação livre.","NEX 40%"],["Anular Ritual","Quando for alvo de um ritual, você pode gastar uma quantidade de PE igual ao custo pago por esse ritual e fazer um teste oposto de Ocultismo contra o conjurador. Se vencer, você anula o ritual, cancelando todos os seus efeitos.","NEX 65%"],["Canalizar o Medo","Você aprende o ritual Canalizar o Medo.","NEX 99%"])],["Flagelador",L(["Poder do Flagelo","Ao conjurar um ritual, você pode gastar seus próprios pontos de vida para pagar o custo em pontos de esforço, à taxa de 2 PV por PE pago. Pontos de vida gastos dessa forma só podem ser recuperados com descanso.","NEX 10%"],["Abraçar a Dor","Sempre que sofrer dano não paranormal, você pode gastar uma reação e 2 PE para reduzir esse dano à metade.","NEX 40%"],["Absorver Agonia","Sempre que reduz um ou mais inimigos a 0 PV com um ritual, você recebe uma quantidade de PE temporários igual ao círculo do ritual utilizado. Por exemplo, se ativar esse poder com um ritual de 2º círculo, receberá 2 PE.","NEX 65%"],["Medo Tangível","Você aprende o ritual Medo Tangível.","NEX 99%"])],["Graduado",L(["Saber Ampliado","Você aprende um ritual de 1º círculo. Toda vez que ganha acesso a um novo círculo, aprende um ritual adicional daquele círculo. Esses rituais não contam no seu limite de rituais.","NEX 10%"],["Grimório Ritualístico","Você cria um grimório especial, que armazena rituais que sua mente não seria capaz de guardar. Você aprende uma quantidade de rituais de 1º ou 2º círculos igual ao seu Intelecto. Quando ganha acesso a um novo círculo, pode incluir um novo ritual desse círculo em seu grimório. Esses rituais não contam em seu limite de rituais conhecidos. Para conjurar um ritual armazenado em seu grimório, você precisa antes gastar uma ação completa folheando o grimório e relembrando o ritual. O grimório ocupa 1 espaço em seu inventário. Se perdê-lo, você pode replicá-lo com duas ações de interlúdio.","NEX 40%"],["Rituais Eficientes","A DT para resistir a todos os seus rituais aumenta em +5.","NEX 65%"],["Conhecendo o Medo","Você aprende o ritual Conhecendo o Medo.","NEX 99%"])],["Intuitivo",L(["Mente Sã","Você compreende melhor as entidades do Outro Lado, e passa a ser menos abalado por seus efeitos. Você recebe resistência paranormal +5 (+5 em testes de resistência contra efeitos paranormais).","NEX 10%"],["Presença Poderosa","Sua resiliência mental faz com que você possa extrair mais do Outro Lado. Você adiciona sua Presença ao seu limite de PE por turno, mas apenas para conjurar rituais (não para DT).","NEX 40%"],["Inabalável","Você recebe resistência a dano mental e paranormal 10. Além disso, quando é alvo de um efeito paranormal que permite um teste de Vontade para reduzir o dano à metade, você não sofre dano algum se passar.","NEX 65%"],["Presença do Medo","Você aprende o ritual Presença do Medo.","NEX 99%"])],["Lâmina Paranormal",L(["Lâmina Maldita","Você aprende o ritual Amaldiçoar Arma. Se já o conhece, pode gastar +1 PE quando o lança para reduzir seu tempo de conjuração para movimento. Além disso, quando conjura esse ritual, você pode usar Ocultismo, em vez de Luta ou Pontaria, para testes de ataque com a arma amaldiçoada.","NEX 10%"],["Gladiador Paranormal","Sempre que acerta um ataque corpo a corpo em um inimigo, você recebe 2 PE temporários. Você pode ganhar um máximo de PE temporários por cena igual ao seu limite de PE. PE temporários desaparecem no final da cena.","NEX 40%"],["Conjuração Marcial","Uma vez por rodada, quando você lança um ritual com execução de uma ação padrão, pode gastar 2 PE para fazer um ataque corpo a corpo como uma ação livre.","NEX 65%"],["Lâmina do Medo","Você aprende o ritual Lâmina do Medo.","NEX 99%"])]]],
['Origens',[['Origens',L(["Acadêmico","Perícias treinadas: Ciências e Investigação. Saber é Poder: ao testar Intelecto, gaste 2 PE para receber +5 no teste.",'','','',"ciencias,investigacao"],["Agente de Saúde","Perícias treinadas: Intuição e Medicina. Técnica Medicinal: ao curar um personagem, some seu Intelecto aos PV curados.",'','','',"intuicao,medicina"],["Amnésico","Perícias treinadas: duas à escolha do mestre. Vislumbres do Passado: uma vez por sessão, teste de Intelecto (DT 10) para reconhecer pessoas ou lugares familiares; se passar, recebe 1d4 PE temporários e, a critério do mestre, uma informação útil.",'','','',""],["Artista","Perícias treinadas: Artes e Enganação. Magnum Opus: uma vez por missão, determine que um personagem em cena de interação o reconheça; você recebe +5 em testes de Presença e de perícias baseadas em Presença contra ele.",'','','',"artes,enganacao"],["Atleta","Perícias treinadas: Acrobacia e Atletismo. 110%: em testes de perícia com Força ou Agilidade (exceto Luta e Pontaria), gaste 2 PE para receber +5.",'','','',"acrobacia,atletismo"],["Chef","Perícias treinadas: Fortitude e Profissão (cozinheiro). Ingrediente Secreto: em cenas de interlúdio, você pode preparar um prato especial; quem se alimentar recebe o benefício em dobro (efeitos iguais se acumulam).",'','','',"fortitude,profissao"],["Criminoso","Perícias treinadas: Crime e Furtividade. O Crime Compensa: ao fim de uma missão, escolha um item encontrado nela; na próxima missão, você pode incluí-lo no inventário sem contar no limite de itens da patente.",'','','',"crime,furtividade"],["Cultista Arrependido","Perícias treinadas: Ocultismo e Religião. Traços do Outro Lado: você possui um poder paranormal à sua escolha, mas começa o jogo com metade da Sanidade normal da classe.",'','','',"ocultismo,religiao"],["Desgarrado","Perícias treinadas: Fortitude e Sobrevivência. Calejado: você recebe +1 PV para cada 5% de NEX. [bônus automático]",'','','',"fortitude,sobrevivencia"],["Engenheiro","Perícias treinadas: Profissão e Tecnologia. Ferramentas Favoritas: um item à sua escolha (exceto armas) conta como uma categoria abaixo para você.",'','','',"profissao,tecnologia"],["Executivo","Perícias treinadas: Diplomacia e Profissão. Processo Otimizado: ao fazer teste de perícia durante teste estendido, ou ao revisar documentos, gaste 2 PE para receber +5.",'','','',"diplomacia,profissao"],["Investigador","Perícias treinadas: Investigação e Percepção. Faro para Pistas: uma vez por cena, ao procurar pistas, gaste 1 PE para receber +5 no teste.",'','','',"investigacao,percepcao"],["Lutador","Perícias treinadas: Luta e Reflexos. Mão Pesada: você recebe +2 nas rolagens de dano com ataques corpo a corpo.",'','','',"luta,reflexos"],["Magnata","Perícias treinadas: Diplomacia e Pilotagem. Patrocinador da Ordem: seu limite de crédito é sempre considerado um acima do atual.",'','','',"diplomacia,pilotagem"],["Mercenário","Perícias treinadas: Iniciativa e Intimidação. Posição de Combate: no primeiro turno de cada cena de ação, gaste 2 PE para ganhar uma ação de movimento adicional.",'','','',"iniciativa,intimidacao"],["Militar","Perícias treinadas: Pontaria e Tática. Para Bellum: você recebe +2 nas rolagens de dano com armas de fogo.",'','','',"pontaria,tatica"],["Operário","Perícias treinadas: Fortitude e Profissão. Ferramenta de Trabalho: escolha uma arma simples ou tática que possa passar por ferramenta; você sabe usá-la e recebe +1 em ataque, dano e margem de ameaça com ela.",'','','',"fortitude,profissao"],["Policial","Perícias treinadas: Percepção e Pontaria. Patrulha: você recebe +2 na Defesa. [bônus automático]",'','','',"percepcao,pontaria"],["Religioso","Perícias treinadas: Religião e Vontade. Acalentar: +5 em testes de Religião para acalmar; ao acalmar uma pessoa, ela recebe Sanidade igual a 1d6 + sua Presença.",'','','',"religiao,vontade"],["Servidor Público","Perícias treinadas: Intuição e Vontade. Espírito Cívico: ao fazer um teste para ajudar, gaste 1 PE para aumentar em +2 o bônus concedido.",'','','',"intuicao,vontade"],["Teórico da Conspiração","Perícias treinadas: Investigação e Ocultismo. Eu Já Sabia: você recebe resistência a dano mental igual ao seu Intelecto.",'','','',"investigacao,ocultismo"],["T.I.","Perícias treinadas: Investigação e Tecnologia. Motor de Busca: com acesso à internet, gaste 2 PE para substituir um teste de perícia qualquer por um teste de Tecnologia.",'','','',"investigacao,tecnologia"],["Trabalhador Rural","Perícias treinadas: Adestramento e Sobrevivência. Desbravador: em testes de Adestramento ou Sobrevivência, gaste 2 PE para +5; além disso, terreno difícil não reduz seu deslocamento.",'','','',"adestramento,sobrevivencia"],["Trambiqueiro","Perícias treinadas: Crime e Enganação. Impostor: uma vez por cena, gaste 2 PE para substituir um teste de perícia qualquer por um teste de Enganação.",'','','',"crime,enganacao"],["Universitário","Perícias treinadas: Atualidades e Investigação. Dedicação: +1 PE, mais +1 PE a cada NEX ímpar (15%, 25%…); seu limite de PE por turno aumenta em 1 (efeito sobre a DT não se aplica).",'','','',"atualidades,investigacao"],["Vítima","Perícias treinadas: Reflexos e Vontade. Cicatrizes Psicológicas: você recebe +1 de Sanidade para cada 5% de NEX. [bônus automático]",'','','',"reflexos,vontade"])]]],
['Poderes Paranormais',[["Conhecimento",L(["Expansão de Conhecimento","Você se conecta com o Conhecimento do Outro Lado, rompendo os limites de sua compreensão. Você aprende um poder de classe que não pertença à sua classe (caso o poder possua pré-requisitos, você precisa preenchê-los). Pré-requisito: Conhecimento 1. Afinidade: você aprende um segundo poder de classe que não pertença à sua classe.",""],["Percepção Paranormal","O Conhecimento sussurra em sua mente. Em cenas de investigação, sempre que fizer um teste para procurar pistas, você pode rolar novamente um dado com resultado menor que 10. Você deve aceitar a segunda rolagem, mesmo que seja menor que a primeira. Afinidade: você pode rolar novamente até dois dados com resultado menor que 10.",""],["Precognição","Você possui um “sexto sentido” que o avisa do perigo antes que ele aconteça. Você recebe +2 em Defesa e em testes de resistência. Pré-requisito: Conhecimento 1. Afinidade: você fica imune à condição desprevenido.",""],["Sensitivo","Você consegue sentir as emoções e intenções de outros personagens, como medo, raiva ou malícia, recebendo +5 em testes de Diplomacia, Intimidação e Intuição. Afinidade: quando você faz um teste oposto usando uma dessas perícias, o oponente sofre –1d20.",""],["Visão do Oculto","Você não enxerga mais pelos olhos, mas sim pela percepção do Conhecimento em sua mente. Você recebe +5 em testes de Percepção e enxerga no escuro. Afinidade: você ignora camuflagem.",""])],["Energia",L(["Afortunado","A Energia considera resultados medíocres entediantes. Uma vez por rolagem, você pode rolar novamente um resultado 1 em qualquer dado que não seja d20. Afinidade: além disso, uma vez por teste, você pode rolar novamente um resultado 1 em d20.",""],["Campo Protetor","Você consegue gerar um campo de Energia que o protege de perigos. Quando usa a ação esquiva, você pode gastar 1 PE para receber +5 em Defesa. Pré-requisito: Energia 1. Afinidade: quando usa este poder, você também recebe +5 em Reflexo e, até o início de seu próximo turno, se passar em um teste de Reflexo que reduziria o dano à metade, em vez disso não sofre nenhum dano.",""],["Causalidade Fortuita","A Energia o conduz rumo à descobertas. Em cenas de investigação, a DT para procurar pistas diminui em -5 para você até você encontrar uma pista. Afinidade: a DT para procurar pistas sempre diminui em –5 para você.",""],["Golpe de Sorte","Seus ataques recebem +1 na margem de ameaça. Pré-requisito: Energia 1. Afinidade: seus ataques recebem +1 no multiplicador de crítico.",""],["Manipular Entropia","Nada diverte mais a Energia do que a possibilidade de um desastre ainda maior. Você pode gastar 2 PE para fazer um alvo em alcance curto (exceto você mesmo) rolar novamente um dos dados em um teste de perícia. Pré-requisito: Energia 1. Afinidade: o alvo rola novamente todos os dados que você escolher.",""])],["Morte",L(["Encarar a Morte","Sua conexão com a Morte faz com que você não hesite em situações de perigo. Durante cenas de ação, seu limite de gasto de PE aumenta em +1 (isso não afeta a DT de seus efeitos). Afinidade: durante cenas de ação, seu limite de gasto de PE aumenta em +2 (para um total de +3).",""],["Escapar da Morte","A Morte tem um interesse especial em sua caminhada. Uma vez por cena, quando receber dano que o deixaria com 0 PV, você fica com 1 PV. Não funciona em caso de dano massivo. Pré-requisito: Morte 1. Afinidade: em vez do normal, você evita completamente o dano. Em caso de dano massivo, você fica com 1 PV.",""],["Potencial Aprimorado","A Morte lhe concede potencial latente de momentos roubados de outro lugar. Você recebe +1 ponto de esforço por NEX. Quando sobe de NEX, os PE que recebe por este poder aumentam de acordo. Por exemplo, se escolher este poder em NEX 30%, recebe 6 PE. Quando subir para NEX 35%, recebe +1 PE adicional, e assim por diante. Afinidade: você recebe +1 PE adicional por NEX (para um total de +2 PE por NEX).",""],["Potencial Reaproveitado","Você absorve os momentos desperdiçados de outros seres. Uma vez por rodada, quando passa num teste de resistência, você ganha 2 PE temporários cumulativos. Os pontos desaparecem no final da cena. Afinidade: você ganha 3 PE temporários, em vez de 2.",""],["Surto Temporal","A sua percepção temporal se torna distorcida e espiralizada, fazendo com que a noção de passagem do tempo nunca mais seja a mesma para você. Uma vez por cena, durante seu turno, você pode gastar 3 PE para realizar uma ação padrão adicional. Pré-requisito: Morte 2. Afinidade: em vez de uma vez por cena, você pode usar este poder uma vez por turno.",""])],["Sangue",L(["Anatomia Insana","O seu corpo é transfigurado e parece desenvolver um instinto próprio separado da sua consciência. Você tem 50% de chance (resultado par em 1d4) de ignorar o dano adicional de um acerto crítico ou ataque furtivo. Pré-requisito: Sangue 2. Afinidade: você é imune aos efeitos de acertos críticos e ataques furtivos.",""],["Arma de Sangue","O Sangue devora parte de seu corpo e se manifesta como parte de você. Você pode gastar uma ação de movimento e 2 PE para produzir garras, chifres ou uma lâmina de sangue cristalizado que brota de seu antebraço. Qualquer que seja sua escolha, é considerada uma arma simples leve que você não precisa empunhar e causa 1d6 pontos de dano de Sangue. Uma vez por turno, quando você usa a ação agredir, pode gastar 1 PE para fazer um ataque adicional com essa arma. A arma dura até o final da cena, e então se desfaz numa poça de sangue coagulado. Afinidade: a arma se torna permanentemente parte de você e causa 1d10 pontos de dano de Sangue.",""],["Sangue de Ferro","O seu sangue flui de forma paranormal e agressiva, concedendo vigor não natural. Você recebe +2 pontos de vida por NEX. Quando sobe de NEX, os PV que recebe por este poder aumentam de acordo. Por exemplo, se escolher este poder em NEX 50%, recebe 20 PV. Quando subir para NEX 55%, recebe +2 PV, e assim por diante. Afinidade: você recebe +5 em Fortitude e se torna imune a venenos e doenças.",""],["Sangue Fervente","A intensidade da dor desperta em você sentimentos bestiais e prazerosos que você nem imaginava que existiam. Enquanto estiver machucado, você recebe +1 em Agilidade ou Força, à sua escolha (escolha sempre que este efeito for ativado). Pré-requisito: Sangue 2. Afinidade: o bônus que você recebe em Agilidade ou Força aumenta para +2.",""],["Sangue Vivo","A carnificina não pode parar, o Sangue precisa continuar fluido. Na primeira vez que ficar machucado durante uma cena, você recebe cura acelerada 2. Esse efeito nunca cura você acima da metade dos PV máximos (ou seja, você nunca deixa de estar machucado) e termina no fim da cena ou caso você perca a condição machucado. Pré-requisito: Sangue 1. Afinidade: a cura acelerada aumenta para 5.",""])],["Varia",L(["Aprender Ritual","Através de uma conexão com as memórias de ocultistas do passado e os segredos das entidades, você aprende e pode conjurar um ritual de 1º círculo à sua escolha. Além disso, você pode substituir um ritual que já conhece por outro. A partir de 45% de NEX, quando escolhe este poder, você aprende um ritual de até 2º círculo e, a partir de 75% de NEX, aprende um ritual de até 3º círculo. Você pode escolher esse poder quantas vezes quiser, mas está sujeito ao limite de rituais conhecidos. Este poder conta como um poder do elemento do ritual escolhido.",""],["Resistir a <Elemento>","Escolha entre Conhecimento, Energia, Morte ou Sangue. Você recebe resistência 10 contra esse elemento. Este poder conta como um poder do elemento escolhido. Afinidade: aumenta a resistência para 20.",""])]]],
['Livros e Suplementos',[['Arquivos Confidenciais',L('Projeto Sigma','Experimento Humano','Arma Biológica','Documento Secreto')],['Marcas Fragmentadas',L('Marca da Besta','Cicatriz Paranormal','Memória Fragmentada')],['Insurgentes',L('Célula de Resistência','Contrabando','Esconderijo Secreto','Falsificação de Documentos')]]],
['Rituais',[['Rituais de Conhecimento',L(["Compreensão Paranormal","Execução: padrão. Alcance: toque. Alvo: 1 ser ou objeto. Duração: cena. Resistência: Vontade anula. O ritual confere a você compreensão sobrenatural da linguagem. Se tocar um objeto contendo informação (ou livro, um dispositivo com uma gravação...), você entende as palavras mesmo que não conheça seu idioma, contanto que se trate de um idioma humano (não funciona com símbolos ou sigilos paranormais). Se tocar uma pessoa, pode se comunicar com ela como se falassem um idioma em comum. Se tocar um ser não inteligente, como um animal, pode perceber seus sentimentos básicos, como medo ou felicidade. Um alvo involuntário tem direito a um teste de Vontade. Discente (+2 PE): muda o alcance para “curto” e o alvo para “alvos escolhidos”. Você pode entender todos os alvos afetados. Requer 2º círculo. Verdadeiro (+5 PE): muda o alcance para “pessoal” e o alvo para “você”. Em vez do normal, você pode falar, entender e escrever qualquer idioma humano. Requer 3º círculo.","Conhecimento 1"],["Enfeitiçar","Execução: padrão. Alcance: curto. Alvo: 1 pessoa. Duração: cena. Resistência: Vontade anula. Este ritual torna o alvo prestativo. Ele não fica sob seu controle, mas percebe suas palavras e ações da maneira mais favorável possível. Você recebe um bônus de +10 em testes de Diplomacia com ele. Um alvo hostil ou que esteja envolvido em combate recebe +5 em seu teste de resistência. Se você ou seus aliados tomarem qualquer ação hostil contra o alvo, o efeito é dissipado e o alvo retorna à atitude que tinha antes (ou piorada, de acordo com o mestre). Discente (+2 PE): em vez do normal, você sugere uma ação para o alvo e ele obedece. A sugestão deve ser feita de modo que pareça aceitável, a critério do mestre. Pedir que o alvo atire em seu companheiro, por exemplo, dissipa o efeito. Já sugerir a um guarda que descanse um pouco, de modo que você e seus aliados passem por ele, é aceitável. Quando o alvo executa a ação, o efeito termina. Você pode determinar uma condição específica para a sugestão: por exemplo, que o policial prenda a próxima pessoa de casaco verde que ele encontrar. Requer 2º círculo. Verdadeiro (+5 PE): afeta todos os alvos dentro do alcance. Requer 3º círculo.","Conhecimento 1"],["Ouvir os Sussurros","Execução: completa. Alcance: pessoal. Alvo: você. Duração: instantânea. O ritual conecta você com os sussurros, memórias ecoadas pelo Outro Lado, que você pode consultar para receber conhecimento proibido em relação a uma ação que tomará em breve. Ao usar este ritual, faça uma pergunta sobre um evento que você está prestes a fazer (na mesma cena) que possa ser respondida com “sim” ou “não”. O mestre rola 1d6 em segredo; com um resultado de 2 a 6, o ritual funciona e você recebe sua resposta, que pode ser “sim”, “não” ou “sim e não”. Com um resultado 1, o ritual falha e oferece o resultado “não”. Não há como saber se esse resultado foi dado porque o ritual falhou ou não. Lançar este ritual múltiplas vezes sobre o mesmo assunto gera sempre o primeiro resultado. Por exemplo, se você está prestes a entrar em um prédio que pode ser o esconderijo de um cultista. Se você perguntar para os sussurros se o cultista está mesmo nesse local, a resposta pode ser “sim” (ele está no prédio), “não” (ele não está no prédio) ou “sim e não” (ele está no prédio, mas usou um ritual para se esconder seu corpo físico em uma dimensão do Outro Lado...). Isso é útil para saber se você deve (ou não) gastar recursos para um possível combate. Discente (+2 PE): muda a execução para 1 minuto. Em vez do normal, você pode consultar os ecos fazendo uma pergunta sobre um evento que poderá acontecer até um dia no futuro. O mestre rola a chance de falha; com um resultado de 2 a 6, você recebe uma resposta, desde uma simples frase até uma profecia ou enigma. Em geral, este uso oferece pistas, indicando um caminho a tomar para descobrir a resposta que se procura. Numa falha você não recebe resposta alguma. Requer 2º círculo. Verdadeiro (+5 PE): muda a execução para 10 minutos e a duração para 5 rodadas. Em vez do normal, você consulta os ecos, podendo fazer uma pergunta por rodada, desde que ela possa ser respondida com “sim”, “não” ou “ninguém sabe”. O mestre rola a chance de falha para cada pergunta. Em caso de falha, a resposta também é “ninguém sabe”. Requer 3º círculo.","Conhecimento 1"],["Perturbação","Execução: padrão. Alcance: curto. Alvo: 1 pessoa. Duração: 1 rodada. Resistência: Vontade (anula). Você dá uma ordem que o alvo deve ser capaz de ouvir (mas não precisa entender). Se falhar na resistência, ele deve obedecer à ordem em seu próprio turno da melhor maneira possível. Escolha um dos efeitos. Fuja: O alvo gasta seu turno tentando se afastar de você (usando todas as suas ações). Largue: O alvo solta quaisquer itens que esteja segurando e não pode pegá-los novamente até o início de seu próximo turno. Como esta é uma ação livre, ele ainda pode executar outras ações (exceto pegar aquilo que largou). Pare: O alvo fica pasmo (não pode realizar ações, só reações). Sente-se: Com uma ação livre, o alvo se senta no chão (se estava pendurado ou voando, desce até o chão). Ele pode fazer outras ações, mas não levantar até o início de seu próximo turno. Venha: O alvo gasta seu turno se aproximando de você (usando todas as suas ações). Discente (+2 PE): muda o alvo para “1 ser” e adiciona o seguinte comando: “Sofra. O alvo é acometido de dor aguda, sofrendo 3d8 de dano de Conhecimento e ficando abalado por uma rodada”. Verdadeiro (+5 PE): muda o alvo para “até 5 seres” ou adiciona o seguinte comando: “Ataque. O alvo deve fazer a ação agredir contra um outro alvo a sua escolha em alcance médio, com todas as suas capacidades”. Requer 3º círculo e afinidade.","Conhecimento 1"],["Tecer Ilusão","Execução: padrão. Alcance: médio. Efeito: ilusão que se estende a até 4 cubos de 1,5m. Duração: cena. Resistência: Vontade desacredita. Este ritual cria uma ilusão visual (uma pessoa, uma parede...) ou sonora (um grito de socorro, um uivo assustador...). O ritual cria apenas imagens ou sons simples, com volume equivalente à voz de uma pessoa para cada cubo de 1,5m no efeito. Não é possível criar cheiros, texturas ou temperaturas, nem sons complexos, como uma música ou diálogo. Seres e objetos atravessam uma ilusão sem sofrer dano, mas o ritual pode, por exemplo, esconder uma armadilha ou emboscada. A ilusão é dissipada se você sair do alcance. Discente (+2 PE): muda o efeito para até 8 cubos de 1,5m e a duração para sustentada. Você pode criar ilusões de imagem e sons combinados, e pode criar sons complexos, odores e sensações térmicas. Também pode criar sensações táteis, como texturas; objetos ainda atravessam a ilusão, mas seres não conseguem atravessá-la sem passar em um teste de Vontade. A cada rodada, você pode usar uma ação livre para mover a imagem ou alterar o som, como aumentar o volume ou fazer com que pareça se afastar ou se aproximar, ainda dentro dos limites do efeito. Você pode, por exemplo, criar a ilusão de um fantasma que anda pela sala, controlando seus movimentos. A ilusão ainda é incapaz de causar ou sofrer dano. Quando você para de sustentar o ritual, a imagem ou som persistem por mais uma rodada antes do ritual se dissipar. Requer 2º círculo. Verdadeiro (+5 PE): você cria a ilusão de um perigo mortal. Quando o ritual é conjurado, e no início de cada um de seus turnos, um alvo interagindo com a ilusão deve fazer um teste de Vontade; se falhar, acredita que a ilusão é real e sofre 6d6 pontos de dano de Conhecimento. O alvo racionaliza o efeito sempre que falha no teste (por exemplo, acredita que o mesmo teto pode cair sobre ele várias vezes). Se um alvo passar em dois testes de Vontade seguidos, o efeito é anulado para ele. Requer 3º círculo.","Conhecimento 1"],["Terceiro Olho","Execução: padrão. Alcance: pessoal. Alvo: você. Duração: cena. Seus olhos se enchem de sigilos e você passa a enxergar auras paranormais em alcance longo. Rituais, itens amaldiçoados e criaturas emitem auras. Você sabe o elemento da aura e seu poder aproximado — rituais de 1º círculo e criaturas de VD até 80 emitem uma aura fraca; rituais de 2º e 3º círculos e criaturas de VD entre 81 e 280 emitem uma aura moderada, e rituais de 4º círculo e criaturas de VD 281 ou maior emitem uma aura poderosa. Além disso, você pode gastar uma ação de movimento para descobrir se um ser que possa ver em alcance médio tem poderes paranormais ou se é capaz de conjurar rituais e de quais elementos. Discente (+2 PE): muda a duração para 1 dia. Verdadeiro (+5 PE): também pode enxergar objetos e seres invisíveis, que aparecem como formas translúcidas.","Conhecimento 1"],["Aprimorar Mente","Execução: padrão. Alcance: toque. Alvo: 1 ser. Duração: cena. O alvo tem sua mente energizada por fagulhos do Conhecimento. Ele recebe +1 em Intelecto ou Presença, à escolha dele (esse aumento não fornece PE ou perícias treinadas). Discente (+3 PE): muda o bônus para +2. Requer 3º círculo. Verdadeiro (+7 PE): muda o bônus para +3. Requer 4º círculo e afinidade.","Conhecimento 2",'',"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAABtCAYAAABAz1RVAAAnWklEQVR42u2dd5iU1fn3v1O20Is0AUEQQUVExS6xgBgrGsXYsGD9xZZoYjQaS2yxRxMsKZbEoImoqLFjjRLBAio2iiggKr2XZXfmfv/Yz3Fujs/sUjawkve5rrlm5qnn3L2eJ2VmqsdbVlKVpFJJLSWZpJmSUvyuiy3cazNJlZK+YX9GUq6+AiZdj5FWAtK6SvqJpDY1IC0FoLNc5z9ZjhWbq3FsuqStJJ0pqTlIy/5/xK05p1VK2lfSMEmfS/ogQloaTizjfw5EV0afKo7lQWQpiPRbnu9XIZB/SOrOtSX1EUCpeiYqUyAkJ+lYSTdLOl/Sw+zPR+d4AuyJuGspqRygL5M0T9JcOGqOuybjEOaJIS/pt5IGSRosaQzIq6xvlF2fkBY45wxJ10saIumJCHDGOb0lnQqHbCKps6TWkpo4jlohaTGf2ZJmSJoqabikNxP0XBCbvwKBT0g6UtKoeqfzzKy+fFJ8H29m883sGP6XmlnaHe9qZuea2Rhb++0bMzvBzNqbWSf3/PDJsO93nLsd/9P1BV71DWmHmtkSM7uM/yURsDY1s0fMrIpPjo+ZWd7MKsxsKd9vmdks9z+cm+f8CjN728xu4bl+PBn3+1kz+9rMOtcn5NUHpAVA7G1my8zsFbgs687Z3Mz+AMCrHPADAkaZ2aVm1pvzbzKzDmZ2Df93hUtvAlkV7vo8XHUR18hxuuDICWb2sZm1jQjtfxZxAQA7mdk8Pr3hNJlZEzM71QF5pfv9qZn93sxOM7NNIkK4xMwOhpvK3bGsmR1oZmeb2d/NbG4kQqeD4BacX8b  por você ficam invisíveis. Uma luz transportada nunca fica invisível (mesmo que sua fonte seja). Qualquer parte de um item carregado que se estenda além de seu alcance corpo a corpo natural se torna visível. Discente (+3 PE): muda a duração para “sustentada”. Em vez do normal, você gera uma esfera de invisibilidade. Você e todos os aliados a até 3m de você se tornam invisíveis, como no efeito normal do ritual (ainda ficam visíveis caso façam uma ação hostil). A esfera se move juntamente com você; qualquer coisa que saia da esfera fica visível. Requer 3º círculo. Verdadeiro (+7 PE): muda a execução para “ação padrão”, o alcance para “toque”, o alvo para “1 ser” e a duração para “sustentada”. O efeito não é dissipado caso o alvo faça um ataque ou ação hostil. Requer 4º círculo e afinidade.","Conhecimento 2",'',"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGwAAABuCAYAAADCrvbGAAAmw0lEQVR42u2dd7iU1bX/vzNnzqFLEUSKkWIFVBCDKBqvBXsBo1hyYzQaC5YY04wtamJiiiW5xiTWJMZesGvU2AC7IooiTYqASO+cNrN+f8xn/2axfeecmYPoubm8zzPPgZm37L3X2mt/13ettd+UmamZHhWSspL2kXSapN9ImrSRnpWSZJJaSjpP0maSfi1pjfutWRzpZi6sPSQ9KKmVpI824vMMwVRLmiXpYkm/kFTV3MapOQostKmjpP+RtLmkWyXVl3mfQZL2K6OfKf6+LOlFST+QdLgT5iaBNTK7vidpoKSpkt6LBrWU4xRJJ5RxXRDMAknP893pkjrTnvQmgSW3JyupjaQhCO8fkj5rwr1alzkrjeelJL0iaaGkgyTt1hzNT3NqT461a5ikOkmvMfDlLv47SOpS5szM8ow3JI2nLbsiyFxzMI3NUWCS1E/Slmj6h00wh2nWsM5NAB8VklZhitOS9gQ1bpphCYt+zgEOkzRZ0ko3mOWaxI5NFHZK0nRm3E5OYJtmWHTU06YtGJx1kmqbCNMNoTX12mXMtJ6sqZtmWBFY3cbNjJWsY02934bMiNUILC2pRXMZpEwzhfUZBwLKEXZDgisXtKyVVOPatElgCaZIaPWSEgRg7hprxLzVlnCPpLEJ41O9SWAN+2Gr+H+lmz1pB7v9IFdislpIagdA6M5vbSVtL2kps6Ua4cX3SCd818KtgbWbBFbasYXyPOJaZx7bSeqGn9VL0taStuJvL64Jx5aS3pE0RdInyvOEsyXNAYHOk7TcodMK53P1kNSef2c2CSzZfGXc+hH8sY5o+K6S9pY0mL89i9wnFw1yK3yyQdF5i5XnDN+WNJa/1U4xtmOWzXTt2SSwyCxVggqn8XeIpEsQwEhmVjjqEkBFivukE4Ro0aezpGP4LJP0EJ8JmMLBXPsCwpWbif+nBZaiHXVochdJO/JblaQz3bm1TiCVGwjvc+7TUdKpkr6JCa2S1J/zngXiV+In2v9lgQVWoQ6NP1nSEZi/jNPoHGtL1Rf87HQkvA4qhGTCsw9Qns+c5dr7lc201FcUcU451CdJJ0k6l3VmQ3yeXMKMMq1P3DbkUOciABLYl8mS VR74L/h6AAAAABJRU5ErkJggg=="],["Localização","Execução: padrão. Alcance: pessoal. Área: círculo com 90m de raio. Duração: cena. Este ritual pode encontrar uma pessoa ou objeto a sua escolha. Você pode pensar em termos gerais (“um policial”, “algo de metal”) ou específicos (“A delegada Joana”, “uma pistola”). O ritual indica a direção e distância da pessoa ou objeto mais próximo desse tipo, caso esteja ao alcance. Você pode movimentar-se para continuar procurando. Procurar algo muito específico (“a chave do armazém 4 no porto”) exige que você tenha em mente uma imagem precisa do objeto; caso a imagem não seja parecida com a verdade, o ritual falha, mas você gasta os PE mesmo assim. Este ritual pode ser bloqueado por uma fina camada de chumbo. Discente (+3 PE): muda o alcance para “toque”, o alvo para “1 pessoa” e a duração para “1 hora”. Em vez do normal, a pessoa tocada descobre o caminho mais direto para entrar ou sair de um lugar. Assim, o ritual pode ser usado para descobrir a rota até o relicário de uma catedral ou a saída mais próxima de uma caverna (mas não para encontrar a localização de uma pessoa ou objeto; funciona apenas em relação a lugares). Caso a pessoa demore mais de uma hora para percorrer o caminho, o conhecimento se perde. Verdadeiro (+7 PE): aumenta a área para círculo de 1km de raio. Requer 4º círculo.","Conhecimento 2",'',"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAABpCAYAAADbXhZDAAAqS0lEQVR42t2dd5icVdn/7ylbQjoJBAiEEghBhCRIqDaKFGkiRUSaEFFEBQQEBCmCohQFASkCAakqAtIFITQB6YRQQm+BkEASUrbOzv3+sZ/73W/O75myIau+v7muuWZ35nnOc865ez05d7c+fhXMrMnMvmBm25nZ8WbWYmY5M+vzh/fxurrMbLyZnWBmV5vZ3WbWzvd9+sr38fhryYJuNLORZtZvCcfK8U6/yy/Bhlcavzcv5545ZjbIzC43s/vN7FzW2aevYh8hQ9nMPm9m15nZymbWZmafmNkNZvYxzy31AmAm1Fk0s+XZsHYw/kWeuZwAuMA9ZT4Xmdl8M9vQzN40s1lmtgbz+ljGj/nXepXNrMHM3jGzyWa2vplN5L2xmR1qZo/3YrzeYfFSZpXB/lZjc+L1hpnta2aPCIvpDRKYmY0ws1UA3LcA2l1mtrWZzTSzFcxsV74vmFkz97dx/1tm9iDfLzCzp8zsp2b2mJn9zcw6zey5Cs+uhfwlM9vJzC5gjsZ4q5vZjD4hOXdfWu88n5919yvcvdO7X9PdfSK/FesYJ8c
